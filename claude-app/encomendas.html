<script>
(function () {
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback } = React;
// Permite escrever style="a:b;c:d" nos modelos (o React exige objeto).

    if (!k) continue;
    o[k.startsWith("--") ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = v;

}
function h(type, props, ...children) {

const html = htm.bind(h);

const fmtBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const fmtUSD = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "USD" });
function money(v, cur = "BRL") {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";

}
function fdate(iso) { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; }

  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");

}

function today() { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date()); }

// ---------------- Cálculos ----------------
// Cotação usada quando o pedido não tem cotação própria (a de hoje; definida pelo App a cada render)
let FALLBACK_RATE = null;
function convert(amount, from, to, rate) { if (from === to) return amount; if (!rate) return null; return from === "USD" ? amount * rate : amount / rate; }
const n0 = (v) => (typeof v === "number" && Number.isFinite(v) ? v : 0);

function totals(o) {

  const payTo = (p, target) => (p.currency === target ? n0(p.amount) : target === "BRL" && p.brlAmount != null ? n0(p.brlAmount) : target === "USD" && p.usdAmount != null ? n0(p.usdAmount) : to(n0(p.amount), p.currency, p.rate, target));
  const items = o.items || [], expenses = o.expenses || [], pays = o.payments || [], taxes = o.taxPayments || [];

  const taxForecastBRL = o.taxMode === "por_fora" ? r2(n0(o.taxForecast)) : 0;

  const paidBRL = pays.reduce((s, p) => s + payTo(p, "BRL"), 0);
  const pendingBRL = to(Math.max(pending, 0), cur, null, "BRL");
  const landedBRL = r2(paidBRL + pendingBRL + extrasBRL + taxForecastPendingBRL);
  return {
    cur, orate, manualBRL, pieces, itemsTotal: r2(itemsTotal), freight: n0(o.freight), discount: n0(o.discount), supplierExpenses: r2(supplierExpenses),
    supplierTotal, supplierTotalBRL: r2(to(supplierTotal, cur, null, "BRL")), paid, paidBRL: r2(paidBRL), pending, pendingBRL: r2(pendingBRL), payStatus, taxPaidBRL, taxAwaiting, taxForecastBRL, taxForecastPendingBRL, taxDone: !!o.taxDone, taxTotalBRL: r2(taxPaidBRL + taxIncludedBRL),
    extrasBRL, extrasPendingBRL, landedBRL, costPerPiece: pieces > 0 ? landedBRL / pieces : null, missingRate,

}
function receipt(o) {
  const items = o.items || [], trk = o.trackings || [];
  const expected = items.reduce((s, i) => s + n0(i.pieces), 0);
  const received = items.reduce((s, i) => s + n0(i.receivedQty), 0);
  const defective = items.reduce((s, i) => s + n0(i.defectiveQty), 0);
  const checked = items.some((i) => i.receivedQty !== null && i.receivedQty !== undefined);
  const pk = trk.filter((t) => t.received).length;
  let status;
  if (!checked && pk === 0) status = "nao_recebido";
  else if (defective > 0 || items.some((i) => n0(i.receivedQty) > n0(i.pieces))) status = "divergencia";
  else if (items.length && items.every((i) => n0(i.receivedQty) === n0(i.pieces))) status = "completo";

// Valor em dólar: reais em destaque e o dólar pequeno ao lado
const toBRLv = (v, cur, rate) => (cur === "USD" ? convert(v, "USD", "BRL", rate || FALLBACK_RATE) : v);
function M(v, cur, rate, block) {
  if (cur !== "USD" || v === null || v === undefined) return money(v, cur);
  const b = toBRLv(v, cur, rate);
  if (b === null) return html`${money(v, "USD")}<span class=${cx("brl", block && "blk")}>sem cotação</span>`;
  return html`${money(b)}<span class=${cx("brl", block && "blk")}>${money(v, "USD")}</span>`;

// Campo de conversão (R$ <-> $): calculado pela cotação, mas pode ser digitado à mão
function useConv(init) {
  const [val, setVal] = useState(init != null ? toInput(init) : "");
  const [manual, setManual] = useState(init != null);
  return { val, setVal, manual, setManual, clear() { setVal(""); setManual(false); } };
}
const convAuto = (amount, from, target, rate) => { const a = parseDec(amount), r = parseDec(rate); return a && r ? r2(convert(a, from, target, r)) : null; };
// Carrega o valor convertido de um lançamento salvo (edição)
function convLoad(cv, x, target) {
  const saved = target === "BRL" ? x.brlAmount : x.usdAmount;
  const auto = x.rate ? r2(convert(x.amount, x.currency, target, x.rate)) : null;
  if (saved != null && (auto === null || Math.abs(saved - auto) > 0.009)) { cv.setVal(toInput(saved)); cv.setManual(true); } else cv.clear();
}
// Resultado para salvar: cotação efetiva + valor convertido
function convResult(a, from, target, r, cv) {
  const m = cv.manual ? parseDec(cv.val) : null;
  if (m && m > 0) {
    const rate = target === "BRL" ? m / a : a / m;
    return { rate, brlAmount: target === "BRL" ? m : a, usdAmount: target === "USD" ? m : a };
  }
  if (!r) return null;
  const c = r2(convert(a, from, target, r));
  return { rate: r, brlAmount: target === "BRL" ? c : a, usdAmount: target === "USD" ? c : a };
}
function convField(cv, amount, from, target, rate, id, label) {
  const auto = convAuto(amount, from, target, rate);
  const a = parseDec(amount), m = parseDec(cv.val);
  const eff = cv.manual && a && m ? (target === "BRL" ? m / a : a / m) : null;
  return html`<${Field} label=${label || (target === "BRL" ? "Valor em reais" : "Equivale em dólar")} hint=${cv.manual
      ? html`Digitado à mão${eff ? " · cotação efetiva " + money(eff) : ""} · <button type="button" class="link" onClick=${() => cv.clear()}>calcular pela cotação</button>`
      : "Calculado pela cotação. Pode editar se não bater."}>
    <span class="money" data-sym=${SYM(target)}><input id=${id} inputmode="decimal" value=${cv.manual ? cv.val : auto === null ? "" : toInput(auto)} placeholder="0,00"
      onInput=${(e) => { cv.setVal(e.target.value); cv.setManual(e.target.value.trim() !== ""); }} /></span><//>`;
}

// Dica para campos digitados em dólar: "= R$ X"
const brlHint = (val, cur, rate) => { if (cur !== "USD") return null; const v = parseDec(val); if (!v) return null; const b = toBRLv(v, "USD", rate); return b === null ? "Defina a cotação para ver em reais" : "= " + money(b); };
const isLate = (o) => !!o.expectedDate && o.expectedDate < today() && !CLOSED.includes(o.status);
function rateFor(rates, day) {
  let best = null;
  for (const r of rates) if (r.id <= day && (!best || r.id > best.id)) best = r;
  return best;
}
function trackingLink(code, carrier) {

// Fila por documento: uma escrita de cada vez no mesmo documento.
const queues = new Map();
function queued(path, fn) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  queues.set(path, next);
  return next;
}

function useStore() {
  const [st, setSt] = useState({ ready: false, db: null, noDb: false, canWrite: true, isAdmin: false, data: { orders: [], suppliers: [], products: [], modes: [], carriers: [], methods: [], rates: [], settings: [] }, loaded: {}, user: null, meId: null, assets: null });
  useEffect(() => {
    let unsubs = [], alive = true;
    (async () => {
      const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
      if (!alive) return;
      if (!db) { setSt((s) => ({ ...s, ready: true, noDb: true })); return; }
      let canWrite = true, isAdmin = false;
      try { const w = await user?.can("data.write"); if (w === false) canWrite = false; } catch (e) {}
      try { isAdmin = !!((await user?.canEdit()) || (await user?.isOwner())); } catch (e) {}
      let meId = null;
      try { meId = (await user?.me())?.id || null; } catch (e) {}
      setSt((s) => ({ ...s, ready: true, db, canWrite, isAdmin, user, meId }));
      // Comprovantes: só quem pode editar recebe o armazenamento de arquivos
      Promise.resolve(window.claude?.use?.("assets")).then((a) => { if (alive && a) setSt((s) => ({ ...s, assets: a })); }).catch(() => {});
      for (const name of Object.keys(COLS)) {
        const u = db.collection(COLS[name]).onSnapshot(
          (snap) => {
            const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setSt((s) => ({ ...s, data: { ...s.data, [name]: rows }, loaded: { ...s.loaded, [name]: true } }));
          },
          (e) => console.error("db", name, e),
        );
        unsubs.push(u);
      }
    })();
    return () => { alive = false; unsubs.forEach((u) => u()); };
  }, []);
  return st;
}

// ---------------- Histórico de alterações ----------------
const PAY_WORD = { payments: "Pagamento", taxPayments: "Imposto pago" };
function describeChange(prev, patch) {
  const out = [];
  const amt = (x) => (x ? (x.currency === "USD" ? money(x.amount, "USD") : money(x.amount)) : "");
  if ("status" in patch && patch.status !== prev.status) out.push("Status: " + (ORDER_STATUS[prev.status] || "—") + " → " + ORDER_STATUS[patch.status]);
  for (const k of ["payments", "taxPayments"]) {
    if (!(k in patch)) continue;
    const a = prev[k] || [], b = patch[k] || [];
    const ids = new Set(a.map((x) => x.id));
    const added = b.filter((x) => !ids.has(x.id));
    const removed = a.filter((x) => !b.some((y) => y.id === x.id));
    const changed = b.filter((x) => { const o = a.find((y) => y.id === x.id); return o && JSON.stringify(o) !== JSON.stringify(x); });
    added.forEach((x) => out.push(PAY_WORD[k] + " lançado: " + amt(x) + (x.date ? " (" + fdate(x.date) + ")" : "")));
    removed.forEach((x) => out.push(PAY_WORD[k] + " excluído: " + amt(x)));
    changed.forEach((x) => { const o = a.find((y) => y.id === x.id); out.push(PAY_WORD[k] + " alterado: " + (amt(o) !== amt(x) ? amt(o) + " → " + amt(x) : amt(x)) + ((x.files || []).length !== (o.files || []).length ? " (comprovantes)" : "")); });
  }
  if ("trackings" in patch) {
    const a = prev.trackings || [], b = patch.trackings || [];
    const n = b.filter((x) => !a.some((y) => y.id === x.id)).length, r = a.filter((x) => !b.some((y) => y.id === x.id)).length;
    if (n) out.push(n + " rastreio(s) adicionado(s)");
    if (r) out.push(r + " rastreio(s) excluído(s)");
    const st = b.filter((x) => { const o = a.find((y) => y.id === x.id); return o && (o.status !== x.status || o.received !== x.received); });
    if (st.length) out.push("Rastreio atualizado: " + st.map((x) => x.code + " → " + (x.received ? "recebido" : TRK_STATUS[x.status] || x.status)).join(", "));
  }
  if ("items" in patch) out.push("Conferência de recebimento salva");
  if ("expenses" in patch) out.push("Despesas atualizadas");
  if ("needsReview" in patch && !patch.needsReview) out.push("Marcado como revisado");
  if ("taxDone" in patch) out.push(patch.taxDone ? "Imposto marcado como concluído" : "Imposto reaberto");
  if ("taxForecast" in patch) out.push("Previsão de imposto: " + money(patch.taxForecast || 0));
  return out.join(" · ") || "Pedido atualizado";
}
// Data/hora de mudança de status de cada rastreio (para o alerta de rastreio parado)
function stampTrackings(prev, list) {
  const now = new Date().toISOString();
  return list.map((k) => { const o = (prev || []).find((x) => x.id === k.id); return o && o.status === k.status && o.received === k.received ? { ...k, statusAt: k.statusAt || o.statusAt || null } : { ...k, statusAt: now }; });
}

function makeApi(db, getData, getMe) {
  const col = (c) => db.collection(c);
  const lastHist = {}; // histórico mais recente escrito por esta tela (o banco pode ainda não ter devolvido)
  const hist = (id, prev, what) => {
    const base = lastHist[id] && lastHist[id].length >= (prev?.history || []).length ? lastHist[id] : prev?.history || [];
    const h = [...base, { at: new Date().toISOString(), by: getMe() || null, what }].slice(-200);
    lastHist[id] = h;
    return h;
  };
  const findOrder = (id) => getData().orders.find((o) => o.id === id);
  return {
    async saveOrder(id, body) {
      const path = "orders/" + id;
      return queued(path, () => {
        const prev = findOrder(id);
        let what = prev ? "Pedido editado" : "Pedido criado";
        if (prev) {
          const a = totals(prev), b = totals(body);
          if (Math.abs(a.supplierTotal - b.supplierTotal) > 0.009) what += " · total " + money(a.supplierTotal, a.cur) + " → " + money(b.supplierTotal, b.cur);
          if (prev.status !== body.status) what += " · status " + (ORDER_STATUS[prev.status] || "—") + " → " + ORDER_STATUS[body.status];
        }
        return col("orders").doc(id).set({ ...body, history: hist(id, prev || body, what) });
      });
    },
    async patchOrder(id, patch) {
      const path = "orders/" + id;
      return queued(path, () => {
        const prev = findOrder(id) || {};
        const p = { ...patch };
        if (p.trackings) p.trackings = stampTrackings(prev.trackings, p.trackings);
        p.history = hist(id, prev, describeChange(prev, p));
        return col("orders").doc(id).update({ ...p, updatedAt: new Date().toISOString() });
      });
    },
    async deleteOrder(id) { return queued("orders/" + id, () => col("orders").doc(id).delete()); },
    async saveEntity(c, id, body) { return queued(c + "/" + id, () => col(c).doc(id).set(body)); },
    async deleteEntity(c, id) { return queued(c + "/" + id, () => col(c).doc(id).delete()); },
    async setRate(day, value) { return queued("rates/" + day, () => col("rates").doc(day).set({ usdBrl: value, updatedAt: new Date().toISOString() })); },
    async deleteRate(day) { return queued("rates/" + day, () => col("rates").doc(day).delete()); },
  };
}

// Encontra um cadastro pelo nome (sem diferenciar maiúsculas) ou cria na hora.
async function resolveName(api, list, c, name) {
  const n = norm(name);
  if (!n) return null;
  const found = list.find((x) => key(x.name) === key(n));
  if (found) return found.id;
  const id = uid();
  await api.saveEntity(c, id, { name: n, createdAt: new Date().toISOString() });
  return id;
}

function Painel({ ctx }) {
  const { D, byId, go, setFilters, today: t, curRate } = ctx;
  const rows = D.orders.filter((o) => o.status !== "cancelado").map((o) => ({ o, t: totals(o), r: receipt(o) }));
  const open = rows.filter((x) => !CLOSED.includes(x.o.status));
  // Tudo somado em reais: saldo em dólar convertido pela cotação de cada pedido (ou a de hoje, se o pedido não tiver)
  const pend = { USD: 0, BRL: 0, total: 0, usdBRL: 0 }; let extras = 0, taxFc = 0; const bySup = {};
  for (const { o, t: tt } of rows) {
    extras += tt.extrasPendingBRL;
    taxFc += tt.taxForecastPendingBRL;
    if (tt.pending <= 0.01) continue;
    pend[tt.cur] += tt.pending; pend.total += tt.pendingBRL; if (tt.cur === "USD") pend.usdBRL += tt.pendingBRL;

  }

  const toBRL = (v) => v.total;
  const late = open.filter((x) => isLate(x.o));
  const soon = addDays(t, 15);

  const attention = rows.map((x) => ({ ...x, al: alertsFor(x.o, x.t, x.r, t) })).filter((x) => x.al.length);

        <div class="small">${right(x)}</div></div>`)}</div>` : html`<div class="empty">${empty}</div>`;

  if (!D.orders.length) {
    return html`<${Head} title="Painel" actions=${html`<button class="btn pri" onClick=${() => go("novo")}>+ Novo pedido</button>`} />
      <${Card} title="Comece por aqui"><p>Nenhum pedido ainda. Cadastre o primeiro pedido; o painel passa a mostrar o que falta pagar, o que está atrasado e o que chega nos próximos dias.</p>
      <div class="row"><button class="btn pri" onClick=${() => go("novo")}>Cadastrar primeiro pedido</button></div><//>`;
  }
  return html`<${Head} title="Painel" actions=${html`<button class="btn pri" onClick=${() => go("novo")}>+ Novo pedido</button>`} />
    <div class="stats">
      <${Stat} label="Pedidos a pagar" value=${money(toBRL(pend))} sub=${pend.USD > 0 ? "Inclui " + money(pend.USD, "USD") + " de pedidos em dólar (= " + money(pend.usdBRL) + ")" : "Saldo com fornecedores"} tone=${toBRL(pend) > 0 ? "bad" : "good"} onClick=${() => toList({ pagamento: "em_aberto" })} />
      <${Stat} label="Impostos previstos a pagar" value=${money(taxFc)} sub=${rows.filter((x) => x.t.taxForecastPendingBRL > 0).length + " pedido(s) com previsão"} tone=${taxFc > 0 ? "warn" : null} onClick=${() => toList({ situacao: "imposto_previsto" })} />

      <${Stat} label="Pedidos em aberto" value=${open.length} onClick=${() => toList({ status: "abertos" })} />
      <${Stat} label="Peças a receber" value=${num(open.reduce((s, x) => s + x.r.missing, 0), 0)} onClick=${() => toList({ status: "abertos" })} />
      <${Stat} label="Pedidos atrasados" value=${late.length} tone=${late.length ? "bad" : null} onClick=${() => toList({ situacao: "atrasados" })} />
      <${Stat} label="Despesas pendentes" value=${money(extras)} sub=${rows.filter((x) => x.t.taxAwaiting).length + " com imposto a lançar"} tone=${extras > 0 ? "warn" : null} onClick=${() => toList({ situacao: "imposto" })} />
    </div>

// ---------------- Lista de pedidos ----------------
function filterOrders(D, byId, f) {
  const q = key(f.q);
  return D.orders.map((o) => ({ o, t: totals(o), r: receipt(o), late: isLate(o) })).filter(({ o, t, r, late }) => {
    if (q) {
      const hay = [o.title, o.notes, byId.suppliers[o.supplierId]?.name, ...(o.trackings || []).map((x) => x.code), ...(o.items || []).map((i) => byId.products[i.productId]?.name)].map(key).join(" | ");
      if (!hay.includes(q)) return false;
    }
    if (f.fornecedor && o.supplierId !== f.fornecedor) return false;
    if (f.modalidade && o.modeId !== f.modalidade) return false;
    if (f.transportadora && o.carrierId !== f.transportadora) return false;
    if (f.status === "abertos" && CLOSED.includes(o.status)) return false;
    if (f.status && f.status !== "abertos" && o.status !== f.status) return false;
    if (f.de && (!o.orderDate || o.orderDate < f.de)) return false;
    if (f.ate && (!o.orderDate || o.orderDate > f.ate)) return false;
    if (f.pagamento === "em_aberto" && !(t.pending > 0.01)) return false;
    if (f.pagamento && f.pagamento !== "em_aberto" && t.payStatus !== f.pagamento) return false;
    if (f.recebimento && r.status !== f.recebimento) return false;
    if (f.situacao === "atrasados" && !late) return false;
    if (f.situacao === "revisao" && !o.needsReview) return false;
    if (f.situacao === "imposto" && !t.taxAwaiting) return false;
    if (f.situacao === "imposto_previsto" && !(t.taxForecastPendingBRL > 0)) return false;
    if (f.situacao === "a_pagar" && !(t.pending > 0.01 || t.taxForecastPendingBRL > 0)) return false;
    return true;
  });
}

// ---------------- Ordenação da lista ----------------
const SORTS = [
  ["recentes", "Mais recentes"],
  ["antigos", "Mais antigos"],
  ["aberto", "Maior valor em aberto"],
  ["total", "Maior valor total"],
  ["pecas", "Mais peças"],
  ["chegada", "Chegada mais próxima"],
  ["atraso", "Mais atrasados"],
  ["pago", "Mais pago (%)"],
  ["fornecedor", "Fornecedor (A–Z)"],
  ["status", "Etapa do pedido"],
  ["numero", "Nº do pedido"],
];
const STATUS_ORDER = Object.keys(ORDER_STATUS);
function sortOrders(list, mode, inverted, byId, rate) {
  // Valores em dólar comparados em reais (cotação do pedido ou a de hoje)
  const brl = (v, x) => (x.t.cur === "USD" ? v * (x.t.orate || 1) : v);
  const date = (d, empty) => d || empty;
  const byNumDesc = (a, b) => (b.o.number || 0) - (a.o.number || 0);
  const cmp = {
    recentes: (a, b) => date(b.o.orderDate, "").localeCompare(date(a.o.orderDate, "")) || byNumDesc(a, b),
    antigos: (a, b) => date(a.o.orderDate, "9999").localeCompare(date(b.o.orderDate, "9999")) || -byNumDesc(a, b),
    aberto: (a, b) => brl(Math.max(b.t.pending, 0), b) - brl(Math.max(a.t.pending, 0), a) || byNumDesc(a, b),
    total: (a, b) => brl(b.t.supplierTotal, b) - brl(a.t.supplierTotal, a) || byNumDesc(a, b),
    pecas: (a, b) => b.t.pieces - a.t.pieces || byNumDesc(a, b),
    chegada: (a, b) => (CLOSED.includes(a.o.status) - CLOSED.includes(b.o.status)) || date(a.o.expectedDate, "9999").localeCompare(date(b.o.expectedDate, "9999")) || byNumDesc(a, b),
    atraso: (a, b) => (b.late - a.late) || date(a.o.expectedDate, "9999").localeCompare(date(b.o.expectedDate, "9999")) || byNumDesc(a, b),
    pago: (a, b) => (b.t.supplierTotal > 0 ? b.t.paid / b.t.supplierTotal : 0) - (a.t.supplierTotal > 0 ? a.t.paid / a.t.supplierTotal : 0) || byNumDesc(a, b),
    fornecedor: (a, b) => (byId.suppliers[a.o.supplierId]?.name || "~").localeCompare(byId.suppliers[b.o.supplierId]?.name || "~", "pt-BR") || byNumDesc(a, b),
    status: (a, b) => STATUS_ORDER.indexOf(a.o.status) - STATUS_ORDER.indexOf(b.o.status) || byNumDesc(a, b),
    numero: byNumDesc,
  }[mode] || byNumDesc;
  const out = [...list].sort(cmp);
  return inverted ? out.reverse() : out;
}

      ${expenses.length === 0 ? html`<p class="muted small" style="margin:0">Taxas, envio interno, despachante etc. Nenhuma despesa lançada.</p>` : expenses.map((e) => html`<div class="itembox" key=${e.id}>
        <div class="grid g2">
          <${Field} label="Descrição"><input value=${e.description} onInput=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, description: ev.target.value } : x)))} /><//>
          <${Field} label="Valor"><span class="money" data-sym=${SYM(e.currency)}><input class="exp-amount" inputmode="decimal" value=${e.amount} onInput=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, amount: ev.target.value } : x)))} /></span><//>
          <${Field} label="Moeda"><select class="exp-cur" value=${e.currency} onChange=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, currency: ev.target.value, brl: "", brlManual: false } : x)))}><option value="BRL">R$</option><option value="USD">$</option></select><//>
          ${e.currency === "USD" ? convField(expConv(e), e.amount, "USD", "BRL", f.rate, "exp-brl-" + e.id) : null}
        </div>
        <div class="row between"><div class="row">

      </div>`)}
    <//>

    <${Card} title="Observações">
      <textarea id="f-notes" rows="3" value=${f.notes} onInput=${(e) => set("notes", e.target.value)}></textarea>
      <label class="chk"><input type="checkbox" checked=${f.needsReview} onChange=${(e) => set("needsReview", e.target.checked)} />Marcar como "precisa de revisão"</label>

    <div class="sticky-foot">
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">

    </div>`;
}

function OrderDetail({ ctx, id }) {

  if (!o) return html`<${Head} title="Pedido não encontrado" back=${() => go("pedidos")} /><div class="card"><div class="empty">${ctx.st.loaded.orders ? "Esse pedido foi excluído ou não existe." : "Carregando…"}</div></div>`;
  const tt = totals(o), r = receipt(o), cur = tt.cur, late = isLate(o), costs = itemCosts(o, tt), cst = costStatus(tt);
  const patch = async (p, msg) => { try { await api.patchOrder(o.id, p); if (msg) notify(msg); return true; } catch (e) { console.error(e); notify("Não foi possível salvar. Tente de novo."); return false; } };
  const Info = ({ l, v, bad }) => html`<div><div class="small muted">${l}</div><div style=${bad ? "color:var(--bad);font-weight:600" : "font-weight:500"}>${v || "—"}</div></div>`;

  return html`
    <${Head} title=${html`<span class="num">#${o.number}</span> ${o.title}`} back=${() => go("pedidos")} actions=${html`${canWrite ? html`<button class="btn pri" onClick=${() => go("editar", { id: o.id })}>Editar pedido</button><button class="btn" id="dup" onClick=${() => go("novo", { from: o.id })}>Duplicar</button>` : null}${isAdmin ? html`<${Confirm} question="Excluir o pedido com tudo?" onConfirm=${async () => { await api.deleteOrder(o.id); notify("Pedido excluído."); go("pedidos"); }} />` : null}`} />
    <div class="row"><${Pill} tone=${ORDER_TONE[o.status]}>${ORDER_STATUS[o.status]}<//><${Pill} tone=${PAY_TONE[tt.payStatus]}>${PAY_LABEL[tt.payStatus]}<//><${Pill} tone=${REC_TONE[r.status]}>${REC_LABEL[r.status]}<//>${late ? html`<${Pill} tone="p-bad">Atrasado<//>` : null}${o.needsReview ? html`<${Pill} tone="p-warn">Precisa de revisão<//>` : null}</div>
    ${o.needsReview ? html`<div class="banner b-warn row between"><span>Este pedido foi marcado para revisão. Confira os dados.</span>${canWrite ? html`<button class="btn sm" onClick=${() => patch({ needsReview: false }, "Marcado como revisado.")}>Marcar como revisado</button>` : null}</div>` : null}
    ${tt.missingRate ? html`<div class="banner b-warn">Há valores em outra moeda sem cotação. Edite o pedido e informe a cotação.</div>` : null}

    <${Card} title="Resumo"><div class="grid g2">
      <${Info} l="Fornecedor" v=${byId.suppliers[o.supplierId]?.name} /><${Info} l="Data do pedido" v=${fdate(o.orderDate)} /><${Info} l="Previsão" v=${fdate(o.expectedDate)} bad=${late} />
      <${Info} l="Modalidade" v=${byId.modes[o.modeId]?.name} /><${Info} l="Transportadora" v=${byId.carriers[o.carrierId]?.name} /><${Info} l="Moeda" v=${cur === "USD" ? "Dólar ($)" : "Real (R$)"} />
      <${Info} l="Cotação do pedido" v=${tt.orate ? money(tt.orate) + (tt.manualBRL ? " (efetiva, total em reais digitado)" : "") : "—"} /><${Info} l="Total de peças" v=${num(tt.pieces, 0)} />
    </div>
    ${canWrite ? html`<div class="row"><${Field} label="Status do pedido"><select value=${o.status} onChange=${(e) => patch({ status: e.target.value }, "Status atualizado.")}>${Object.entries(ORDER_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//></div>` : null}
    ${o.notes ? html`<div class="banner" style="background:var(--surface-2);white-space:pre-wrap">${o.notes}</div>` : null}<//>

    <${Card} title="Financeiro">
      <div class="stats">
        <${Stat} label="Total ao fornecedor" value=${money(tt.supplierTotalBRL)} sub=${cur === "USD" ? money(tt.supplierTotal, "USD") : null} />
        <${Stat} label="Já pago" value=${money(cur === "USD" ? tt.paidBRL : tt.paid)} sub=${cur === "USD" ? money(tt.paid, "USD") + " (cotação de cada pagamento)" : null} tone="good" />
        <${Stat} label="Falta pagar" value=${money(tt.pending > 0 ? tt.pendingBRL : 0)} sub=${tt.pending < 0 ? "Pago a mais: " + money(-tt.pending, cur) : cur === "USD" ? money(Math.max(tt.pending, 0), "USD") : null} tone=${tt.pending > 0.01 ? "bad" : "good"} />
        <${Stat} label="Imposto e despesas à parte" value=${money(tt.extrasBRL)} sub=${tt.extrasPendingBRL > 0 ? "Despesas pendentes: " + money(tt.extrasPendingBRL) : tt.taxAwaiting ? "Imposto por fora ainda não lançado" : "Nada pendente"} tone=${tt.extrasPendingBRL > 0 || tt.taxAwaiting ? "warn" : null} />
        <${Stat} label="Imposto" value=${o.taxMode === "sem" && tt.taxTotalBRL === 0 ? "Sem imposto" : money(tt.taxTotalBRL)} sub=${tt.taxForecastBRL > 0 ? "Previsto " + money(tt.taxForecastBRL) + (tt.taxDone ? " · concluído" : "") : TAX_LABEL[o.taxMode]} tone=${tt.taxForecastPendingBRL > 0 ? "warn" : null} />
        <${Stat} label="Custo total estimado" value=${money(tt.landedBRL)} sub=${tt.taxForecastPendingBRL > 0 ? "Inclui imposto previsto a pagar" : "Pagamentos + saldo + à parte"} />
        <${Stat} label="Custo real por peça" value=${tt.costPerPiece !== null ? money(tt.costPerPiece) : "—"} sub="Com frete, imposto e despesas" />

        <tr><td>Desconto</td><td class="r">− ${M(tt.discount, cur, tt.orate, true)}</td></tr>${tt.supplierExpenses > 0 ? html`<tr><td>Despesas cobradas pelo fornecedor</td><td class="r">${M(tt.supplierExpenses, cur, tt.orate, true)}</td></tr>` : null}
        <tr><td><strong>Total ao fornecedor</strong></td><td class="r"><strong>${M(tt.supplierTotal, cur, tt.orate, true)}</strong></td></tr></tbody></table>
      ${(o.expenses || []).length ? html`<div><div class="small muted" style="font-weight:600;margin-bottom:4px">OUTRAS DESPESAS</div><div class="list">${o.expenses.map((e) => html`<div class="li" key=${e.id}>
        <span>${e.description} <span class="small muted">${e.chargedBySupplier ? "(cobrada pelo fornecedor)" : e.paid ? "(paga)" : "(pendente)"}</span></span>
        <span class="row"><strong class="tab">${e.currency === "USD" && e.brlAmount != null ? html`${money(e.brlAmount)}<span class="brl">${money(e.amount, "USD")}</span>` : M(e.amount, e.currency, tt.orate)}</strong>${!e.chargedBySupplier && canWrite ? html`<button class="btn sm" onClick=${() => patch({ expenses: o.expenses.map((x) => (x.id === e.id ? { ...x, paid: !x.paid } : x)) })}>${e.paid ? "Desmarcar pago" : "Marcar pago"}</button>` : null}</span></div>`)}</div></div>` : null}
    <//>

    <${Payments} ctx=${ctx} o=${o} tt=${tt} patch=${patch} />
    <${Taxes} ctx=${ctx} o=${o} tt=${tt} patch=${patch} />

    <${Card} title=${"Itens (" + (o.items || []).length + ")"}>
      <div class="tablewrap"><table><thead><tr><th>Produto</th><th class="r">Caixas</th><th class="r">Grades</th><th class="r">Peças</th><th class="r">Receb.</th><th class="r">Unit.</th><th class="r">Total</th><th class="r">Custo real/peça</th></tr></thead><tbody>
      ${(o.items || []).map((i, ix) => html`<tr key=${i.id}><td><strong>${byId.products[i.productId]?.name || "—"}</strong><div class="small muted">${[i.variant, i.ppb ? num(i.ppb) + "/caixa" : null, i.grids && i.ppg ? num(i.ppg) + "/grade" : null].filter(Boolean).join(" · ")}</div>
        ${i.sizes ? html`<div class="row" style="margin-top:4px">${Object.entries(i.sizes).map(([s, q]) => html`<${Pill} key=${s}>${s}: ${q}<//>`)}</div>` : null}</td>
        <td class="r">${i.boxes ? num(i.boxes) : "—"}</td><td class="r">${i.grids ? num(i.grids) : "—"}</td><td class="r"><strong>${num(i.pieces, 0)}</strong></td>
        <td class="r" style=${i.receivedQty == null ? "color:var(--muted)" : i.receivedQty === i.pieces && !i.defectiveQty ? "color:var(--good)" : "color:var(--warn)"}>${i.receivedQty == null ? "—" : num(i.receivedQty, 0)}${i.defectiveQty ? html`<div class="small" style="color:var(--bad)">${i.defectiveQty} def.</div>` : null}</td>
        <td class="r">${M(i.unitPrice, cur, tt.orate, true)}</td><td class="r"><strong>${M(n0(i.pieces) * n0(i.unitPrice), cur, tt.orate, true)}</strong></td><td class="r"><strong style="color:var(--accent)">${costs[ix].cost === null ? "—" : money(costs[ix].cost)}</strong></td></tr>`)}
      <tr><td><strong>Total</strong></td><td></td><td></td><td class="r"><strong>${num(tt.pieces, 0)}</strong></td><td class="r">${r.received ? num(r.received, 0) : "—"}</td><td></td><td class="r"><strong>${M(tt.itemsTotal, cur, tt.orate, true)}</strong></td><td></td></tr>

    <//>

    <${Card} title="Recebimento" actions=${canWrite ? html`<button class="btn pri" onClick=${() => go("conferencia", { id: o.id })}>Conferir recebimento</button>` : null}>

        <${Stat} label="Faltando" value=${num(r.missing, 0)} tone=${r.missing > 0 && r.received > 0 ? "warn" : null} /><${Stat} label="Com defeito" value=${num(r.defective, 0)} tone=${r.defective > 0 ? "bad" : null} />
      </div>
      ${r.pt ? html`<div class="small muted">Pacotes recebidos: ${r.pk} de ${r.pt}</div>` : null}

    <${Trackings} ctx=${ctx} o=${o} patch=${patch} />
    <${History} ctx=${ctx} o=${o} />`;

function Payments({ ctx, o, tt, patch }) {
  const { D, byId, api, isAdmin, canWrite, today: t, notify } = ctx;
  const [date, setDate] = useState(t);
  const [amount, setAmount] = useState("");
  const [currency, setCurrency] = useState(o.currency);
  const [rate, setRate] = useState(toInput(rateFor(D.rates, t)?.usdBrl ?? o.rate));
  const [method, setMethod] = useState("");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editId, setEditId] = useState(null);
  const formRef = useRef(null);
  const cv = useConv();
  const [kept, setKept] = useState([]), [picked, setPicked] = useState([]);
  // Pagamento em dólar: mostra o valor em reais. Pagamento em reais num pedido em dólar: mostra quanto equivale em dólar.
  const convTarget = currency === "USD" ? "BRL" : o.currency === "USD" ? "USD" : null;
  function reset() {
    setEditId(null); setDate(t); setAmount(""); setCurrency(o.currency); setRate(toInput(rateFor(D.rates, t)?.usdBrl ?? o.rate)); setMethod(""); setNotes(""); setErr(null); cv.clear(); setKept([]); setPicked([]);
  }
  function startEdit(p) {
    setKept(p.files || []); setPicked([]);
    setEditId(p.id); setDate(p.date || ""); setAmount(toInput(p.amount)); setCurrency(p.currency || o.currency);
    setRate(toInput(p.rate ?? rateFor(D.rates, p.date || t)?.usdBrl ?? o.rate)); setMethod(byId.methods[p.methodId]?.name || ""); setNotes(p.notes || ""); setErr(null);
    const tg = (p.currency || o.currency) === "USD" ? "BRL" : o.currency === "USD" ? "USD" : null;
    if (tg) convLoad(cv, p, tg); else cv.clear();
    setTimeout(() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
  }
  async function add() {
    setErr(null);
    const a = parseDec(amount), r = parseDec(rate);
    if (!date) return setErr("Informe a data.");
    if (!a || a <= 0) return setErr("Informe o valor pago.");
    const conv = convTarget ? convResult(a, currency, convTarget, r, cv) : null;
    if (convTarget && !conv) return setErr("Informe a cotação ou o valor convertido deste pagamento.");
    setBusy(true);
    try {
      const methodId = await resolveName(api, D.methods, "methods", method);
      let up = [];
      if (picked.length && ctx.st.assets) { try { up = await uploadAll(ctx.st.assets, picked); } catch (x) { console.error(x); setBusy(false); return setErr(uploadErr(x)); } }
      const orig = editId ? (o.payments || []).find((x) => x.id === editId)?.files || [] : [];
      const pay = { id: editId || uid(), date, amount: a, currency, rate: conv ? conv.rate : r || null, brlAmount: conv ? r2(conv.brlAmount) : null, usdAmount: conv ? r2(conv.usdAmount) : null, methodId, notes: notes.trim() || null, files: [...kept, ...up] };
      if (editId) {
        if (!(o.payments || []).some((x) => x.id === editId)) { reset(); return setErr("Este pagamento foi excluído por outra pessoa."); }
        await api.patchOrder(o.id, { payments: o.payments.map((x) => (x.id === editId ? { ...x, ...pay } : x)) });
        removeAssets(ctx, orig.filter((f) => !kept.some((k) => k.id === f.id)));
        reset(); notify("Pagamento alterado.");
      } else {
        await api.patchOrder(o.id, { payments: [...(o.payments || []), pay] });
        setAmount(""); setNotes(""); cv.clear(); setKept([]); setPicked([]); notify("Pagamento lançado.");
      }
    } catch (e) { console.error(e); setErr(editId ? "Não foi possível salvar a alteração. Tente de novo." : "Não foi possível lançar. Tente de novo."); }
    setBusy(false);
  }
  const pays = [...(o.payments || [])].sort((a, b) => (a.date < b.date ? -1 : 1));
  return html`<${Card} title=${"Pagamentos ao fornecedor (" + pays.length + ")"}>
    ${pays.length === 0 ? html`<div class="empty">Nenhum pagamento lançado.</div>` : html`<div class="list">${pays.map((p) => {
      const inOrder = p.currency === o.currency ? p.amount : o.currency === "USD" && p.usdAmount != null ? p.usdAmount : o.currency === "BRL" && p.brlAmount != null ? p.brlAmount : convert(p.amount, p.currency, o.currency, p.rate || tt.orate);
      const inBRL = p.currency === "USD" ? (p.brlAmount ?? convert(p.amount, "USD", "BRL", p.rate || tt.orate)) : p.amount;
      return html`<div class="li" key=${p.id} style=${editId === p.id ? "background:var(--accent-soft);border-radius:6px" : ""}><div><strong class="tab">${fdate(p.date)} · ${p.currency === "USD" ? html`${inBRL === null ? money(p.amount, "USD") : money(inBRL)}<span class="brl">${money(p.amount, "USD")}</span>` : money(p.amount)}</strong>${p.currency === "BRL" && o.currency === "USD" && inOrder !== null ? html`<span class="brl">${money(inOrder, "USD")}</span>` : null}
        <div class="small muted">${[byId.methods[p.methodId]?.name, p.rate ? "cotação " + money(p.rate) : null, p.notes].filter(Boolean).join(" · ")}</div><${FileLinks} files=${p.files} /></div>
        <span class="row">${canWrite ? html`<button class="btn sm" onClick=${() => startEdit(p)}>Editar</button>` : null}${isAdmin ? html`<${Confirm} small onConfirm=${() => { if (editId === p.id) reset(); patch({ payments: o.payments.filter((x) => x.id !== p.id) }, "Pagamento excluído.").then((ok) => ok && removeAssets(ctx, p.files)); }} />` : null}</span></div>`;
    })}</div>`}
    ${canWrite ? html`<div ref=${formRef} style=${"background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:10px" + (editId ? ";outline:2px solid var(--accent)" : "")}>
      <strong>${editId ? "Editar pagamento" : "Lançar pagamento"}</strong>
      <datalist id="dl-met">${D.methods.map((m) => html`<option key=${m.id} value=${m.name} />`)}</datalist>
      <div class="grid g2">
        <${Field} label="Data"><input type="date" value=${date} onChange=${(e) => { setDate(e.target.value); const rr = rateFor(D.rates, e.target.value); if (rr) setRate(toInput(rr.usdBrl)); }} /><//>
        <${Field} label="Valor pago"><span class="money" data-sym=${SYM(currency)}><input id="pay-amount" inputmode="decimal" value=${amount} placeholder=${tt.pending > 0 ? toInput(tt.pending) : ""} onInput=${(e) => setAmount(e.target.value)} /></span><//>
        <${Field} label="Moeda"><select id="pay-cur" value=${currency} onChange=${(e) => { setCurrency(e.target.value); cv.clear(); }}><option value="BRL">R$</option><option value="USD">$</option></select><//>
        <${Field} label="Cotação ($1 =)"><span class="money" data-sym="R$"><input id="pay-rate" inputmode="decimal" value=${rate} onInput=${(e) => setRate(e.target.value)} /></span><//>
        ${convTarget ? convField(cv, amount, currency, convTarget, rate, "pay-conv") : null}
        <${Field} label="Forma de pagamento"><input list="dl-met" value=${method} onInput=${(e) => setMethod(e.target.value)} /><//>
        <${Field} label="Observação"><input value=${notes} onInput=${(e) => setNotes(e.target.value)} /><//>
        <${AttachPicker} ctx=${ctx} kept=${kept} setKept=${setKept} picked=${picked} setPicked=${setPicked} />
      </div>
      ${err ? html`<div class="err">${err}</div>` : null}
      <div class="row"><button class="btn pri" id="pay-save" disabled=${busy} onClick=${add}>${busy ? "Salvando…" : editId ? "Salvar alteração" : "Lançar pagamento"}</button>${editId ? html`<button class="btn" onClick=${reset}>Cancelar</button>` : null}</div></div>` : null}
  <//>`;
}

function Taxes({ ctx, o, tt, patch }) {
  const { D, isAdmin, canWrite, today: t, notify, api } = ctx;
  const [open, setOpen] = useState(tt.taxAwaiting);
  const [date, setDate] = useState(t);
  const [amount, setAmount] = useState("");
  const [currency, setCurrency] = useState("BRL");
  const [rate, setRate] = useState(toInput(rateFor(D.rates, t)?.usdBrl));
  const [trk, setTrk] = useState("");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [fc, setFc] = useState(o.taxForecast ? toInput(o.taxForecast) : "");
  const [fcEdit, setFcEdit] = useState(false);
  async function saveForecast() {
    const v = fc.trim() === "" ? 0 : parseDec(fc);
    if (v === null || v < 0) return;
    await patch({ taxForecast: v }, "Previsão de imposto salva.");
    setFcEdit(false);
  }
  const diff = tt.taxForecastBRL > 0 && tt.taxPaidBRL > 0 ? (tt.taxPaidBRL - tt.taxForecastBRL) / tt.taxForecastBRL * 100 : null;
  const [editId, setEditId] = useState(null);
  const formRef = useRef(null);
  const cv = useConv();
  const [kept, setKept] = useState([]), [picked, setPicked] = useState([]);
  function reset() {
    setEditId(null); setDate(t); setAmount(""); setCurrency("BRL"); setRate(toInput(rateFor(D.rates, t)?.usdBrl)); setTrk(""); setNotes(""); setErr(null); cv.clear(); setKept([]); setPicked([]);
  }
  function startEdit(x) {
    setEditId(x.id); setDate(x.date || ""); setAmount(toInput(x.amount)); setCurrency(x.currency || "BRL");
    setRate(toInput(x.rate ?? rateFor(D.rates, x.date || t)?.usdBrl)); setTrk(x.trackingId || ""); setNotes(x.notes || ""); setErr(null); setOpen(true);
    if ((x.currency || "BRL") === "USD") convLoad(cv, x, "BRL"); else cv.clear();
    setKept(x.files || []); setPicked([]);
    setTimeout(() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
  }
  async function add() {
    setErr(null);
    const a = parseDec(amount), r = parseDec(rate);
    if (!a || a <= 0) return setErr("Informe o valor do imposto pago.");
    const conv = currency === "USD" ? convResult(a, "USD", "BRL", r, cv) : null;
    if (currency === "USD" && !conv) return setErr("Informe a cotação ou o valor em reais.");
    setBusy(true);
    try {
      let up = [];
      if (picked.length && ctx.st.assets) { try { up = await uploadAll(ctx.st.assets, picked); } catch (x) { console.error(x); setBusy(false); return setErr(uploadErr(x)); } }
      const orig = editId ? (o.taxPayments || []).find((x) => x.id === editId)?.files || [] : [];
      const tax = { id: editId || uid(), date, amount: a, currency, rate: conv ? conv.rate : null, brlAmount: conv ? r2(conv.brlAmount) : null, trackingId: trk || null, notes: notes.trim() || null, files: [...kept, ...up] };
      if (editId) {
        if (!(o.taxPayments || []).some((x) => x.id === editId)) { reset(); setBusy(false); return setErr("Este lançamento foi excluído por outra pessoa."); }
        await api.patchOrder(o.id, { taxPayments: o.taxPayments.map((x) => (x.id === editId ? { ...x, ...tax } : x)) });
        removeAssets(ctx, orig.filter((f) => !kept.some((k) => k.id === f.id)));
        reset(); notify("Lançamento de imposto alterado.");
      } else {
        await api.patchOrder(o.id, { taxMode: o.taxMode === "sem" ? "por_fora" : o.taxMode, taxPayments: [...(o.taxPayments || []), tax] });
        setAmount(""); setNotes(""); cv.clear(); setKept([]); setPicked([]); notify("Imposto lançado.");
      }
    } catch (e) { console.error(e); setErr(editId ? "Não foi possível salvar a alteração. Tente de novo." : "Não foi possível lançar. Tente de novo."); }
    setBusy(false);
  }
  const list = o.taxPayments || [];
  return html`<${Card} title="Imposto">
    <div><strong>${TAX_LABEL[o.taxMode]}</strong> <span class="muted">— ${TAX_HINT[o.taxMode]}</span></div>
    ${o.taxMode === "incluso" && o.taxAmount > 0 ? html`<div>Valor incluso: <strong>${M(o.taxAmount, o.currency, tt.orate)}</strong></div>` : null}
    ${o.taxMode === "por_fora" ? html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:8px">
      <div class="row between"><strong>Previsão × real</strong>${tt.taxDone ? html`<${Pill} tone="p-good">Imposto concluído<//>` : tt.taxForecastPendingBRL > 0 ? html`<${Pill} tone="p-warn">Falta ${money(tt.taxForecastPendingBRL)} (previsto)<//>` : null}</div>
      ${fcEdit ? html`<div class="row" style="align-items:flex-end">
          <${Field} label="Imposto previsto"><span class="money" data-sym="R$"><input id="tx-fc" inputmode="decimal" value=${fc} onInput=${(e) => setFc(e.target.value)} placeholder="0,00" /></span><//>
          <button class="btn pri" onClick=${saveForecast}>Salvar</button><button class="btn" onClick=${() => { setFc(o.taxForecast ? toInput(o.taxForecast) : ""); setFcEdit(false); }}>Cancelar</button></div>`
        : html`<div class="tab">Previsto <strong>${tt.taxForecastBRL > 0 ? money(tt.taxForecastBRL) : "—"}</strong> → Real <strong>${money(tt.taxPaidBRL)}</strong>${diff !== null ? html` <span style=${"color:" + (diff > 0.5 ? "var(--bad)" : diff < -0.5 ? "var(--good)" : "var(--muted)")}>(${diff > 0 ? "+" : ""}${num(diff, 1)}%)</span>` : null}
          ${canWrite ? html` <button class="link" onClick=${() => setFcEdit(true)}>${tt.taxForecastBRL > 0 ? "alterar previsão" : "definir previsão"}</button>` : null}</div>`}
      <div class="small muted">${tt.taxDone ? "Concluído: a previsão não conta mais como a pagar." : "Enquanto não for concluído, o que falta da previsão aparece no painel como imposto a pagar."}</div>
      ${canWrite ? html`<div><button class="btn sm" id="tx-done" onClick=${() => patch({ taxDone: !tt.taxDone }, tt.taxDone ? "Imposto reaberto." : "Imposto marcado como concluído.")}>${tt.taxDone ? "Reabrir imposto" : "✓ Imposto concluído"}</button></div>` : null}
    </div>` : null}
    ${tt.taxAwaiting ? html`<div class="banner b-warn">Imposto por fora ainda não lançado. Quando pagar, lance abaixo.</div>` : null}
    ${o.taxMode !== "incluso" ? html`
      ${list.length ? html`<div class="list">${list.map((x) => html`<div class="li" key=${x.id} style=${editId === x.id ? "background:var(--accent-soft);border-radius:6px" : ""}><div><strong class="tab">${fdate(x.date)} · ${x.currency === "USD" && x.brlAmount != null ? html`${money(x.brlAmount)}<span class="brl">${money(x.amount, "USD")}</span>` : M(x.amount, x.currency, x.rate || tt.orate)}</strong>
        <div class="small muted">${[(o.trackings || []).find((k) => k.id === x.trackingId) ? "Pacote " + o.trackings.find((k) => k.id === x.trackingId).code : "Pedido todo", x.rate ? "cotação " + money(x.rate) : null, x.notes].filter(Boolean).join(" · ")}</div><${FileLinks} files=${x.files} /></div>
        <span class="row">${canWrite ? html`<button class="btn sm" onClick=${() => startEdit(x)}>Editar</button>` : null}${isAdmin ? html`<${Confirm} small onConfirm=${() => { if (editId === x.id) reset(); patch({ taxPayments: list.filter((y) => y.id !== x.id) }, "Lançamento excluído.").then((ok) => ok && removeAssets(ctx, x.files)); }} />` : null}</span></div>`)}
        <div class="li"><strong>Total de imposto pago</strong><strong class="tab">${money(tt.taxPaidBRL)}</strong></div></div>` : null}
      ${canWrite ? html`<details ref=${formRef} open=${open} onToggle=${(e) => setOpen(e.target.open)} style=${"background:var(--surface-2);border-radius:8px;padding:12px" + (editId ? ";outline:2px solid var(--accent)" : "")}><summary>${editId ? "Editar imposto pago" : "Lançar imposto pago"}</summary>
        <div class="grid g2" style="margin-top:10px">
          <${Field} label="Data do pagamento"><input type="date" value=${date} onChange=${(e) => { setDate(e.target.value); const rr = rateFor(D.rates, e.target.value); if (rr) setRate(toInput(rr.usdBrl)); }} /><//>
          <${Field} label="Valor pago"><span class="money" data-sym=${SYM(currency)}><input id="tax-amount" inputmode="decimal" value=${amount} onInput=${(e) => setAmount(e.target.value)} /></span><//>
          <${Field} label="Moeda"><select id="tax-cur" value=${currency} onChange=${(e) => { setCurrency(e.target.value); cv.clear(); }}><option value="BRL">R$</option><option value="USD">$</option></select><//>
          ${currency === "USD" ? html`<${Field} label="Cotação ($1 =)"><span class="money" data-sym="R$"><input id="tax-rate" inputmode="decimal" value=${rate} onInput=${(e) => setRate(e.target.value)} /></span><//>
          ${convField(cv, amount, "USD", "BRL", rate, "tax-conv")}` : null}
          <${Field} label="Referente a"><select value=${trk} onChange=${(e) => setTrk(e.target.value)}><option value="">Pedido todo</option>${(o.trackings || []).map((k) => html`<option key=${k.id} value=${k.id}>Pacote ${k.code}${k.label ? " (" + k.label + ")" : ""}</option>`)}</select><//>
          <${Field} label="Observação"><input value=${notes} onInput=${(e) => setNotes(e.target.value)} /><//>
          <${AttachPicker} ctx=${ctx} kept=${kept} setKept=${setKept} picked=${picked} setPicked=${setPicked} />
        </div>
        ${err ? html`<div class="err">${err}</div>` : null}
        <div class="row" style="margin-top:10px"><button class="btn pri" id="tax-save" disabled=${busy} onClick=${add}>${busy ? "Salvando…" : editId ? "Salvar alteração" : "Lançar imposto"}</button>${editId ? html`<button class="btn" onClick=${reset}>Cancelar</button>` : null}</div></details>` : null}` : null}
  <//>`;
}

function Trackings({ ctx, o, patch }) {
  const { D, byId, api, canWrite, notify, today: t } = ctx;
  const list = o.trackings || [];
  const [adding, setAdding] = useState(list.length === 0);
  const [codes, setCodes] = useState("");
  const [label, setLabel] = useState("");
  const [carrier, setCarrier] = useState(byId.carriers[o.carrierId]?.name || "");
  const [status, setStatus] = useState("postado");
  const [sel, setSel] = useState(new Set());
  const [bulk, setBulk] = useState("em_transito");
  const [editing, setEditing] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const counts = {};
  for (const k of list) counts[k.status] = (counts[k.status] || 0) + 1;

  async function add() {
    setErr(null);
    const all = [...new Set(codes.split(/[\s,;]+/).map((c) => c.trim().toUpperCase()).filter(Boolean))];
    if (!all.length) return setErr("Informe pelo menos um código de rastreio.");
    const have = new Set(list.map((k) => k.code));
    const fresh = all.filter((c) => !have.has(c));
    if (!fresh.length) return setErr("Esses códigos já estão cadastrados neste pedido.");
    setBusy(true);
    try {
      const carrierId = await resolveName(api, D.carriers, "carriers", carrier);
      await patch({ trackings: [...list, ...fresh.map((code) => ({ id: uid(), code, label: norm(label) || null, carrierId, status, received: false, receivedDate: null, notes: null }))] }, fresh.length + " rastreio(s) adicionado(s).");
      setCodes("");
    } finally { setBusy(false); }
  }
  async function applyBulk() {
    await patch({ trackings: list.map((k) => (sel.has(k.id) ? { ...k, status: bulk } : k)) }, "Status aplicado.");
    setSel(new Set());
  }
  return html`<${Card} title=${"Rastreios (" + list.length + ")"}>
    <datalist id="dl-car2">${D.carriers.map((c) => html`<option key=${c.id} value=${c.name} />`)}</datalist>
    ${list.length ? html`<div class="row">${Object.entries(counts).map(([s, n]) => html`<${Pill} key=${s} tone=${TRK_TONE[s]}>${TRK_STATUS[s]}: ${n}<//>`)}<${Pill}>Recebidos: ${list.filter((k) => k.received).length}/${list.length}<//></div>` : null}
    ${canWrite ? (adding ? html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:10px">
      <${Field} label="Códigos de rastreio" hint="Cole um ou vários códigos (um por linha ou separados por espaço/vírgula)."><textarea rows="3" value=${codes} onInput=${(e) => setCodes(e.target.value)} placeholder=${"LZ469784745CN\nLZ468458427CN"}></textarea><//>
      <div class="grid g2">
        <${Field} label="Conteúdo (opcional)"><input value=${label} onInput=${(e) => setLabel(e.target.value)} /><//>
        <${Field} label="Transportadora"><input list="dl-car2" value=${carrier} onInput=${(e) => setCarrier(e.target.value)} /><//>
        <${Field} label="Status inicial"><select value=${status} onChange=${(e) => setStatus(e.target.value)}>${Object.entries(TRK_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
      </div>
      ${err ? html`<div class="err">${err}</div>` : null}
      <div class="row"><button class="btn pri" disabled=${busy} onClick=${add}>${busy ? "Adicionando…" : "Adicionar rastreios"}</button>${list.length ? html`<button class="btn" onClick=${() => setAdding(false)}>Fechar</button>` : null}</div></div>`
      : html`<div><button class="btn" onClick=${() => setAdding(true)}>+ Adicionar rastreios</button></div>`) : null}
    ${list.length && canWrite ? html`<div class="row" style="border:1px solid var(--line);border-radius:8px;padding:8px">
      <label class="chk"><input type="checkbox" checked=${sel.size === list.length} onChange=${(e) => setSel(e.target.checked ? new Set(list.map((k) => k.id)) : new Set())} />Todos</label>
      <span class="small muted">${sel.size} selecionado(s) →</span>
      <select style="width:auto" value=${bulk} onChange=${(e) => setBulk(e.target.value)}>${Object.entries(TRK_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select>
      <button class="btn sm" disabled=${!sel.size} onClick=${applyBulk}>Aplicar status</button></div>` : null}
    ${list.length ? html`<div class="list">${list.map((k) => html`<div key=${k.id} style="padding:8px 0">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
        ${canWrite ? html`<input type="checkbox" checked=${sel.has(k.id)} onChange=${() => setSel((s) => { const n = new Set(s); n.has(k.id) ? n.delete(k.id) : n.add(k.id); return n; })} />` : null}
        <div style="flex:1;min-width:0"><div class="row"><a class="mono" href=${trackingLink(k.code, byId.carriers[k.carrierId])} target="_blank" rel="noreferrer">${k.code}</a><${Pill} tone=${TRK_TONE[k.status]}>${TRK_STATUS[k.status]}<//>${k.received ? html`<${Pill} tone="p-good">Recebido ${fdate(k.receivedDate)}<//>` : null}</div>
          <div class="small muted">${[k.label, byId.carriers[k.carrierId]?.name, k.notes].filter(Boolean).join(" · ")}</div></div>
        ${canWrite ? html`<button class="btn sm" onClick=${() => setEditing(editing === k.id ? null : k.id)}>${editing === k.id ? "Fechar" : "Editar"}</button>` : null}</div>
      ${editing === k.id ? html`<${TrackingEdit} ctx=${ctx} o=${o} k=${k} patch=${patch} done=${() => setEditing(null)} />` : null}</div>`)}</div>` : null}
  <//>`;
}

function TrackingEdit({ ctx, o, k, patch, done }) {
  const { D, byId, api, today: t } = ctx;
  const [v, setV] = useState({ code: k.code, label: k.label || "", carrier: byId.carriers[k.carrierId]?.name || "", status: k.status, received: !!k.received, receivedDate: k.receivedDate || t, notes: k.notes || "" });
  const [busy, setBusy] = useState(false);
  const set = (a, b) => setV((s) => ({ ...s, [a]: b }));
  async function save() {
    setBusy(true);
    try {
      const carrierId = await resolveName(api, D.carriers, "carriers", v.carrier);
      await patch({ trackings: o.trackings.map((x) => (x.id === k.id ? { ...x, code: v.code.trim().toUpperCase() || x.code, label: norm(v.label) || null, carrierId, status: v.status, received: v.received, receivedDate: v.received ? v.receivedDate : null, notes: v.notes.trim() || null } : x)) }, "Rastreio salvo.");
      done();
    } finally { setBusy(false); }
  }
  return html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;margin-top:8px;display:grid;gap:10px"><div class="grid g2">
    <${Field} label="Código"><input value=${v.code} onInput=${(e) => set("code", e.target.value)} /><//>
    <${Field} label="Conteúdo"><input value=${v.label} onInput=${(e) => set("label", e.target.value)} /><//>
    <${Field} label="Transportadora"><input list="dl-car2" value=${v.carrier} onInput=${(e) => set("carrier", e.target.value)} /><//>
    <${Field} label="Status"><select value=${v.status} onChange=${(e) => set("status", e.target.value)}>${Object.entries(TRK_STATUS).map(([a, l]) => html`<option key=${a} value=${a}>${l}</option>`)}</select><//>
    <label class="chk"><input type="checkbox" checked=${v.received} onChange=${(e) => set("received", e.target.checked)} />Pacote recebido</label>
    ${v.received ? html`<${Field} label="Recebido em"><input type="date" value=${v.receivedDate} onChange=${(e) => set("receivedDate", e.target.value)} /><//>` : null}
    <${Field} label="Observação"><input value=${v.notes} onInput=${(e) => set("notes", e.target.value)} /><//>
  </div><div class="row between"><button class="btn pri" disabled=${busy} onClick=${save}>${busy ? "Salvando…" : "Salvar"}</button>
    <${Confirm} small label="Excluir rastreio" onConfirm=${async () => { await patch({ trackings: o.trackings.filter((x) => x.id !== k.id), taxPayments: (o.taxPayments || []).map((x) => (x.trackingId === k.id ? { ...x, trackingId: null } : x)) }, "Rastreio excluído."); done(); }} /></div></div>`;
}

// ---------------- Conferência ----------------
function Conference({ ctx, id }) {
  const { D, byId, api, go, notify, today: t } = ctx;
  const o = D.orders.find((x) => x.id === id);
  const [items, setItems] = useState(() => (o?.items || []).map((i) => ({ id: i.id, name: byId.products[i.productId]?.name || "—", variant: i.variant, expected: n0(i.pieces), sizes: i.sizes, rq: i.receivedQty == null ? "" : String(i.receivedQty), dq: i.defectiveQty == null ? "" : String(i.defectiveQty), notes: i.checkNotes || "", rs: i.receivedSizes ? Object.fromEntries(Object.entries(i.receivedSizes).map(([s, q]) => [s, String(q)])) : null })));
  const [trk, setTrk] = useState(() => (o?.trackings || []).map((k) => ({ id: k.id, code: k.code, label: k.label, received: !!k.received, date: k.receivedDate || "" })));
  const [upd, setUpd] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  if (!o) return html`<${Head} title="Pedido não encontrado" back=${() => go("pedidos")} />`;
  const up = (iid, p) => setItems((l) => l.map((i) => (i.id === iid ? { ...i, ...p } : i)));
  const fullSizes = (i) => (i.sizes ? Object.fromEntries(Object.entries(i.sizes).map(([s, q]) => [s, String(q)])) : null);
  const exp = items.reduce((s, i) => s + i.expected, 0), rec = items.reduce((s, i) => s + (parseDec(i.rq) || 0), 0), def = items.reduce((s, i) => s + (parseDec(i.dq) || 0), 0);
  const int = (v) => { const n = parseDec(v); return n === null ? null : Math.max(0, Math.round(n)); };
  async function save() {
    setBusy(true); setErr(null);
    try {
      const newItems = o.items.map((i) => {
        const c = items.find((x) => x.id === i.id);
        if (!c) return i;
        let rs = null;
        if (c.rs) { rs = {}; for (const [s, q] of Object.entries(c.rs)) { const n = int(q); if (n !== null) rs[s] = n; } if (!Object.keys(rs).length) rs = null; }
        return { ...i, receivedQty: int(c.rq), defectiveQty: int(c.dq), checkNotes: c.notes.trim() || null, receivedSizes: rs };
      });
      const newTrk = (o.trackings || []).map((k) => { const c = trk.find((x) => x.id === k.id); return c ? { ...k, received: c.received, receivedDate: c.received ? c.date || t : null, status: c.received ? "entregue" : k.status } : k; });
      const p = { items: newItems, trackings: newTrk };
      if (upd && !["finalizado", "cancelado"].includes(o.status) && rec > 0) p.status = rec >= exp ? "recebido" : "recebido_parcial";
      await api.patchOrder(o.id, p);
      notify("Conferência salva.");
      go("pedido", { id: o.id });
    } catch (e) { console.error(e); setErr("Não foi possível salvar. Tente de novo."); }
    setBusy(false);
  }
  return html`<${Head} title=${"Conferência #" + o.number} back=${() => go("pedido", { id: o.id })} />
    <p class="muted" style="margin:0">${o.title}. Informe quanto chegou de cada item e marque os pacotes recebidos. Pode conferir aos poucos.</p>
    <div><button class="btn" onClick=${() => { setItems((l) => l.map((i) => ({ ...i, rq: String(i.expected), rs: fullSizes(i) }))); setTrk((l) => l.map((k) => ({ ...k, received: true, date: k.date || t }))); }}>✓ Marcar tudo como recebido</button></div>
    ${trk.length ? html`<${Card} title=${"Pacotes (" + trk.filter((k) => k.received).length + "/" + trk.length + " recebidos)"}><div class="list">${trk.map((k) => html`<div class="li" key=${k.id}>
      <label class="chk"><input type="checkbox" checked=${k.received} onChange=${(e) => setTrk((l) => l.map((x) => (x.id === k.id ? { ...x, received: e.target.checked, date: x.date || t } : x)))} /><span class="mono">${k.code}</span>${k.label ? html`<span class="muted">(${k.label})</span>` : null}</label>
      ${k.received ? html`<input type="date" style="width:auto" value=${k.date} onChange=${(e) => setTrk((l) => l.map((x) => (x.id === k.id ? { ...x, date: e.target.value } : x)))} />` : null}</div>`)}</div><//>` : null}
    <${Card} title="Itens">${items.map((i) => {
      const r = parseDec(i.rq), d = parseDec(i.dq) || 0, diff = r === null ? null : r - i.expected;
      return html`<div key=${i.id} class=${cx("itembox", r !== null && (diff === 0 && d === 0 ? "ok" : "diff"))}>
        <div class="row between" style="align-items:flex-start"><div><strong>${i.name}</strong><div class="small muted">${i.variant ? i.variant + " · " : ""}Esperado: <strong>${i.expected}</strong> peças</div></div>
          <button class="btn sm" onClick=${() => up(i.id, { rq: String(i.expected), rs: fullSizes(i) })}>Recebi tudo</button></div>

function Rates({ ctx }) {
  const { D, api, isAdmin, canWrite, notify, today: t } = ctx;
  const todayRow = D.rates.find((r) => r.id === t);

  const [val, setVal] = useState(toInput(todayRow?.usdBrl));
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const rows = [...D.rates].sort((a, b) => (a.id < b.id ? 1 : -1)).slice(0, 90);
  async function save() {
    setErr(null);
    const v = parseDec(val);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return setErr("Data inválida.");
    if (!v || v <= 0) return setErr("Informe a cotação (ex.: 5,42).");
    setBusy(true);
    try { await api.setRate(day, v); notify("Cotação salva."); } catch (e) { console.error(e); setErr("Não foi possível salvar."); }

    <${Card} title=${todayRow ? "Hoje: $1 = " + money(todayRow.usdBrl) : "Cotação de hoje ainda não definida"}>

        <${Field} label="$1 ="><span class="money" data-sym="R$"><input inputmode="decimal" id="rate-val" value=${val} onInput=${(e) => setVal(e.target.value)} /></span><//>
        <button class="btn pri" disabled=${busy} onClick=${save}>${busy ? "Salvando…" : "Salvar cotação"}</button></div>${err ? html`<div class="err">${err}</div>` : null}` : null}
    <//>
    <${Card} title="Histórico">${rows.length ? html`<div class="list">${rows.map((r) => html`<div class="li" key=${r.id}><span>${fdate(r.id)}</span><span class="row"><strong class="tab">${money(r.usdBrl)}</strong>${isAdmin ? html`<${Confirm} small onConfirm=${() => api.deleteRate(r.id)} />` : null}</span></div>`)}</div>` : html`<div class="empty">Nenhuma cotação cadastrada.</div>`}<//>`;

        <div class="row"><button class="btn pri" onClick=${() => save(edit, r.id)}>Salvar</button><button class="btn" onClick=${() => setEdit(null)}>Cancelar</button></div></div>`
      : html`<div class="li" key=${r.id}><div style="min-width:0"><strong>${r.name}</strong><div class="small muted">${cfg.fields.slice(1).map(([k, l]) => (r[k] ? l + ": " + r[k] : null)).filter(Boolean).join(" · ")}</div></div>
        <div class="row">${canWrite ? html`<button class="btn sm" onClick=${() => { setErr(null); setEdit({ id: r.id, ...Object.fromEntries(cfg.fields.map(([k]) => [k, r[k] == null ? "" : String(r[k])])) }); }}>Editar</button>` : null}

// ---------------- Custo real por peça (precificação) ----------------
// O custo total do pedido em R$ (o que foi pago + saldo + imposto + despesas) é dividido entre os itens
// na proporção do valor de cada um. Assim, custo por peça = preço unitário × (custo total ÷ valor dos produtos).
function costStatus(tt) {
  const why = [];
  if (tt.pending > 0.01) why.push("saldo a pagar ao fornecedor");
  if (tt.taxAwaiting) why.push("imposto ainda não lançado");
  else if (tt.taxForecastPendingBRL > 0) why.push("imposto previsto, ainda não concluído");
  if (tt.extrasPendingBRL > 0) why.push("despesas pendentes");
  if (tt.missingRate) why.push("valor em dólar sem cotação");
  return { final: why.length === 0, why };
}
function itemCosts(o, tt) {
  const factor = tt.itemsTotal > 0 ? tt.landedBRL / tt.itemsTotal : null;
  return (o.items || []).map((i) => {
    const pieces = n0(i.pieces);
    const cost = factor === null || !(n0(i.unitPrice) > 0) ? null : n0(i.unitPrice) * factor;
    const good = i.receivedQty != null ? Math.max(n0(i.receivedQty) - n0(i.defectiveQty), 0) : null;
    const costGood = cost !== null && good !== null && good > 0 && good < pieces ? (cost * pieces) / good : null;
    return { i, pieces, cost, costGood, good };
  });
}
function salePrice(cost, markup, round90) {
  if (cost === null || cost === undefined) return null;
  const p = cost * (1 + n0(markup) / 100);
  return round90 ? Math.ceil(p - 0.9) + 0.9 : r2(p);
}
function arrivalDate(o) {
  const d = (o.trackings || []).filter((k) => k.received && k.receivedDate).map((k) => k.receivedDate).sort();
  return d.length ? d[d.length - 1] : null;
}
function hasArrived(o, r) { return r.received > 0 || ["recebido_parcial", "recebido", "finalizado"].includes(o.status) || (o.trackings || []).some((k) => k.received); }
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 86400000);
function appSettings(D) { const s = D.settings.find((x) => x.id === "app") || {}; return { markup: s.markup ?? 100, round90: !!s.round90 }; }

function MarkupBox({ ctx }) {
  const { D, api, canWrite, notify } = ctx;
  const cfg = appSettings(D);
  const [mk, setMk] = useState(toInput(cfg.markup));
  useEffect(() => { setMk(toInput(cfg.markup)); }, [cfg.markup]);
  async function save(next) {
    const body = { ...cfg, ...next };
    try { await api.saveEntity("settings", "app", body); notify("Preço sugerido atualizado."); } catch (e) { console.error(e); notify("Não foi possível salvar."); }
  }
  const ex = salePrice(40, parseDec(mk) ?? cfg.markup, cfg.round90);
  return html`<div class="row" style="align-items:flex-end">
    <${Field} label="Margem sobre o custo" hint=${"Ex.: custo R$ 40,00 → preço " + money(ex)}><span class="money pct" data-sym="%"><input id="mk" inputmode="decimal" value=${mk} disabled=${!canWrite}
      onInput=${(e) => setMk(e.target.value)} onBlur=${() => { const v = parseDec(mk); if (v !== null && v !== cfg.markup) save({ markup: v }); }} onKeyDown=${(e) => { if (e.key === "Enter") e.target.blur(); }} /></span><//>
    <label class="chk" style="margin-bottom:22px"><input type="checkbox" id="r90" checked=${cfg.round90} disabled=${!canWrite} onChange=${(e) => save({ round90: e.target.checked })} />Arredondar para ,90</label>
  </div>`;
}

function Precos({ ctx }) {
  const { D, byId, go } = ctx;
  const cfg = appSettings(D);
  const [q, setQ] = useState("");
  const [scope, setScope] = useState("chegaram");
  const [mode, setMode] = useState("pedido");

    return { o, tt, r, st: costStatus(tt), costs: itemCosts(o, tt), arrived: hasArrived(o, r), arr: arrivalDate(o), sup: byId.suppliers[o.supplierId]?.name || "" };
  }).filter((x) => scope === "todos" || x.arrived);
  const itemText = (c) => key((byId.products[c.i.productId]?.name || "") + " " + (c.i.variant || ""));
  const price = (c) => salePrice(c.cost, cfg.markup, cfg.round90);
  const pname = (i) => byId.products[i.productId]?.name || "—";

  let body;
  if (mode === "pedido") {
    const list = rows.map((x) => {
      const orderHit = !k || key(x.o.title + " " + x.sup + " #" + x.o.number + " " + x.o.number).includes(k);
      const items = orderHit ? x.costs : x.costs.filter((c) => itemText(c).includes(k));
      return { ...x, items };
    }).filter((x) => x.items.length).sort((a, b) => (b.arr || b.o.orderDate || "").localeCompare(a.arr || a.o.orderDate || "") || (b.o.number || 0) - (a.o.number || 0));
    body = list.length ? list.map((x) => html`<section class="card" key=${x.o.id}>

        <${Pill} tone=${x.st.final ? "p-good" : "p-warn"}>${x.st.final ? "Custo final" : "Custo estimado"}<//></div>
      <div class="cb">
        <div class="small muted">${[x.sup, x.arr ? "chegou " + fdate(x.arr) : x.arrived ? "chegou" : "ainda não chegou", x.tt.itemsTotal > 0 ? "cada " + (x.tt.cur === "USD" ? "$ 1" : "R$ 1") + " de produto custou " + money(x.tt.landedBRL / x.tt.itemsTotal) + " no final" : null].filter(Boolean).join(" · ")}</div>
        ${!x.st.final ? html`<div class="small" style="color:var(--warn)">Pode mudar: ${x.st.why.join(", ")}.</div>` : null}
        <div class="list">${x.items.map((c) => html`<div class="li price-li" key=${c.i.id}>
          <div style="min-width:0"><strong>${pname(c.i)}</strong>${c.i.variant ? html` <span class="muted">· ${c.i.variant}</span>` : null}
            <div class="small muted">${num(c.pieces, 0)} peças · produto ${M(c.i.unitPrice, x.tt.cur, x.tt.orate)}</div>
            ${c.costGood !== null ? html`<div class="small" style="color:var(--warn)">Chegaram ${num(c.good, 0)} boas de ${num(c.pieces, 0)}: por peça boa ${money(c.costGood)}</div>` : null}</div>
          <div class="price-v"><div class="small muted">Custo/peça</div><strong class="tab big">${c.cost === null ? "—" : money(c.cost)}</strong>
            <div class="small tab">Venda sugerida <strong>${c.cost === null ? "—" : money(price(c))}</strong></div></div>
        </div>`)}</div>
      </div></section>`) : html`<div class="card"><div class="empty">${k ? "Nada encontrado com essa busca." : scope === "chegaram" ? "Nenhum pedido chegou ainda. Veja “Todos os pedidos”." : "Nenhum pedido."}</div></div>`;
  } else {
    // Por produto: custo do pedido mais recente e custo médio (ponderado pelas peças)
    const g = {};
    for (const x of rows) for (const c of x.costs) {
      if (c.cost === null) continue;
      const gk = c.i.productId + "|" + key(c.i.variant || "");
      const e = (g[gk] = g[gk] || { gk, name: pname(c.i), variant: c.i.variant || "", n: 0, pcs: 0, sum: 0, min: Infinity, max: 0, last: null });
      e.n++; e.pcs += c.pieces; e.sum += c.cost * c.pieces; e.min = Math.min(e.min, c.cost); e.max = Math.max(e.max, c.cost);
      const d = x.arr || x.o.orderDate || "";
      if (!e.last || d > e.last.d || (d === e.last.d && x.o.number > e.last.o.number)) e.last = { d, o: x.o, cost: c.cost, final: x.st.final };
    }
    const list = Object.values(g).filter((e) => !k || key(e.name + " " + e.variant).includes(k)).sort((a, b) => a.name.localeCompare(b.name, "pt-BR") || a.variant.localeCompare(b.variant, "pt-BR"));
    body = list.length ? html`<div class="card"><div class="cb"><div class="list">${list.map((e) => html`<div class="li price-li" key=${e.gk}>
