        <div class="small muted">${e.n} pedido(s) · ${num(e.pcs, 0)} peças${e.n > 1 ? " · média " + money(e.sum / e.pcs) + " · de " + money(e.min) + " a " + money(e.max) : ""}</div>
        <div class="small muted">Último: <button class="link" onClick=${() => go("pedido", { id: e.last.o.id })}>#${e.last.o.number}</button>${e.last.d ? " (" + fdate(e.last.d) + ")" : ""}${e.last.final ? "" : " · estimado"}</div></div>
      <div class="price-v"><div class="small muted">Último custo</div><strong class="tab big">${money(e.last.cost)}</strong>
        <div class="small tab">Venda sugerida <strong>${money(salePrice(e.last.cost, cfg.markup, cfg.round90))}</strong></div></div></div>`)}</div></div></div>`
      : html`<div class="card"><div class="empty">Nada encontrado.</div></div>`;
  }

  return html`<${Head} title="Preços" />
    <${Card} title="Custo real por peça">
      <p class="small muted" style="margin:0">Custo de cada modelo já com frete, imposto, despesas e o dólar que você realmente pagou. Use para precificar quando a mercadoria chegar.</p>
      <${MarkupBox} ctx=${ctx} />
      <input id="pq" placeholder="Buscar modelo, fornecedor ou nº do pedido" value=${q} onInput=${(e) => setQ(e.target.value)} />
      <div class="row">
        <div class="seg">${[["chegaram", "Já chegaram"], ["todos", "Todos"]].map(([v, l]) => html`<button key=${v} class=${scope === v ? "on" : ""} onClick=${() => setScope(v)}>${l}</button>`)}</div>
        <div class="seg">${[["pedido", "Por pedido"], ["produto", "Por modelo"]].map(([v, l]) => html`<button key=${v} class=${mode === v ? "on" : ""} onClick=${() => setMode(v)}>${l}</button>`)}</div>
      </div>
    <//>
    ${body}`;
}

// ---------------- Análises ----------------
const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const monthLabel = (ym) => MONTHS[Number(ym.slice(5, 7)) - 1] + "/" + ym.slice(2, 4);
function addMonths(ym, n) { const [y, m] = ym.split("-").map(Number); const d = new Date(Date.UTC(y, m - 1 + n, 1)); return d.toISOString().slice(0, 7); }
// Barras horizontais simples (uma série): rótulo e valor em texto, barra só como apoio visual
function Bars({ rows, fmt }) {
  const max = Math.max(0, ...rows.map((r) => r.value));
  return html`<div class="bars">${rows.map((r) => html`<div class=${cx("bar-row", r.onClick && "click")} key=${r.key || r.label} title=${r.label + ": " + fmt(r.value)} onClick=${r.onClick}>
    <div class="bar-top"><span class="bar-l">${r.label}</span><span class="tab bar-v">${fmt(r.value)}${r.sub ? html` <span class="muted small">${r.sub}</span>` : null}</span></div>
    <div class="bar-t"><div class="bar-f" style=${"width:" + (max > 0 && r.value > 0 ? Math.max((r.value / max) * 100, 1.5) : 0) + "%"}></div></div></div>`)}</div>`;
}
function Analises({ ctx }) {
  const { D, byId, go, today: t, setFilters } = ctx;
  const [per, setPer] = useState("6");
  const cur = t.slice(0, 7);
  const fromYm = per === "tudo" ? null : per === "ano" ? t.slice(0, 4) + "-01" : addMonths(cur, -(Number(per) - 1));
  const all = D.orders.filter((o) => o.status !== "cancelado").map((o) => ({ o, t: totals(o), r: receipt(o) }));
  const rows = all.filter((x) => !fromYm || (x.o.orderDate && x.o.orderDate.slice(0, 7) >= fromYm));
  const sum = (l, f) => l.reduce((s, x) => s + f(x), 0);
  const landed = sum(rows, (x) => x.t.landedBRL), pcs = sum(rows, (x) => x.t.pieces);
  const tax = sum(rows, (x) => x.t.taxTotalBRL);

  // Gasto por mês
  const byM = {};
  for (const x of rows) if (x.o.orderDate) byM[x.o.orderDate.slice(0, 7)] = (byM[x.o.orderDate.slice(0, 7)] || 0) + x.t.landedBRL;
  let months = Object.keys(byM).sort();
  if (fromYm) { months = []; for (let m = fromYm; m <= cur; m = addMonths(m, 1)) months.push(m); }
  // Por fornecedor
  const bySup = {};
  for (const x of rows) { const k = x.o.supplierId || "sem"; const e = (bySup[k] = bySup[k] || { id: x.o.supplierId, name: byId.suppliers[x.o.supplierId]?.name || "Sem fornecedor", v: 0, n: 0, p: 0 }); e.v += x.t.landedBRL; e.n++; e.p += x.t.pieces; }
  const sups = Object.values(bySup).sort((a, b) => b.v - a.v);
  // Prazo real de entrega e imposto por modalidade / transportadora
  const group = (field, coll) => {
    const g = {};
    for (const x of rows) {
      const id = x.o[field] || "sem";
      const e = (g[id] = g[id] || { id, name: byId[coll][x.o[field]]?.name || "Não informado", n: 0, days: [], late: [], taxV: 0, base: 0, taxN: 0 });
      e.n++;
      const arr = arrivalDate(x.o);
      if (arr && x.o.orderDate) { e.days.push(daysBetween(x.o.orderDate, arr)); if (x.o.expectedDate) e.late.push(daysBetween(x.o.expectedDate, arr)); }
      const resolved = x.o.taxMode === "sem" || x.o.taxMode === "incluso" || x.o.taxDone || x.t.taxPaidBRL > 0;
      if (resolved && x.t.supplierTotalBRL > 0) { e.taxV += x.t.taxTotalBRL; e.base += x.t.supplierTotalBRL; e.taxN++; }
    }
    return Object.values(g).sort((a, b) => b.n - a.n);
  };
  const avg = (l) => (l.length ? l.reduce((s, v) => s + v, 0) / l.length : null);
  const DelTable = ({ list, title }) => html`<div class="tablewrap"><table><thead><tr><th>${title}</th><th class="r">Pedidos</th><th class="r">Chegaram</th><th class="r">Prazo médio</th><th class="r">vs. previsão</th><th class="r">Imposto</th></tr></thead><tbody>
    ${list.map((e) => { const a = avg(e.days), l = avg(e.late); return html`<tr key=${e.id}><td>${e.name}</td><td class="r">${e.n}</td><td class="r">${e.days.length}</td>
      <td class="r">${a === null ? "—" : num(a, 0) + " dias"}</td>
      <td class="r" style=${l === null ? "" : l > 0.5 ? "color:var(--bad)" : "color:var(--good)"}>${l === null ? "—" : l > 0.5 ? num(l, 0) + " dias atrasado" : l < -0.5 ? num(-l, 0) + " dias antes" : "no prazo"}</td>
      <td class="r" title=${e.taxN + " pedido(s) com imposto resolvido"}>${e.base > 0 ? num((e.taxV / e.base) * 100, 1) + "%" : "—"}</td></tr>`; })}</tbody></table></div>`;

  // Pagamentos a fazer (todos os períodos), pela data prevista de chegada
  const toPay = all.filter((x) => x.t.pending > 0.01 || x.t.taxForecastPendingBRL > 0)
    .map((x) => ({ ...x, pay: (x.t.pending > 0.01 ? x.t.pendingBRL : 0), taxP: x.t.taxForecastPendingBRL }))
    .sort((a, b) => (a.o.expectedDate || "9999").localeCompare(b.o.expectedDate || "9999") || a.o.number - b.o.number);
  let run = 0;

  return html`<${Head} title="Análises" />
    <div class="seg" style="align-self:flex-start">${[["3", "3 meses"], ["6", "6 meses"], ["12", "12 meses"], ["ano", "Este ano"], ["tudo", "Tudo"]].map(([v, l]) => html`<button key=${v} class=${per === v ? "on" : ""} onClick=${() => setPer(v)}>${l}</button>`)}</div>
    <div class="stats">
      <${Stat} label="Total comprado" value=${money(landed)} sub="Pedido + frete + imposto + despesas" />
      <${Stat} label="Pedidos" value=${rows.length} />
      <${Stat} label="Peças" value=${num(pcs, 0)} />
      <${Stat} label="Custo médio por peça" value=${pcs > 0 ? money(landed / pcs) : "—"} />
      <${Stat} label="Imposto pago" value=${money(tax)} sub=${landed > 0 ? num((tax / landed) * 100, 1) + "% do total comprado" : null} />
    </div>
    <div class="cols2">
      <${Card} title="Gasto por mês (data do pedido)">${months.length ? html`<${Bars} fmt=${money} rows=${months.map((m) => ({ key: m, label: monthLabel(m), value: byM[m] || 0 }))} />` : html`<div class="empty">Sem pedidos no período.</div>`}<//>
      <${Card} title="Por fornecedor">${sups.length ? html`<${Bars} fmt=${money} rows=${sups.map((s) => ({ key: s.id || "sem", label: s.name, value: s.v, sub: "· " + s.n + " ped. · " + (s.p > 0 ? money(s.v / s.p) + "/peça" : ""), onClick: s.id ? () => { setFilters({ fornecedor: s.id }); go("pedidos"); } : null }))} />` : html`<div class="empty">Sem pedidos no período.</div>`}<//>
    </div>
    <${Card} title="Prazo de entrega e imposto por modalidade">
      <${DelTable} list=${group("modeId", "modes")} title="Modalidade" />
      <p class="small muted" style="margin:0">Prazo = da data do pedido até o último rastreio marcado como recebido. Imposto = imposto ÷ valor do pedido, só em pedidos com imposto já resolvido.</p>
    <//>
    <${Card} title="Prazo de entrega e imposto por transportadora"><${DelTable} list=${group("carrierId", "carriers")} title="Transportadora" /><//>
    <${Card} title=${"Pagamentos a fazer (" + toPay.length + ")"}>${toPay.length ? html`<div class="tablewrap"><table><thead><tr><th>Chegada prevista</th><th>Pedido</th><th class="r">A pagar ao fornecedor</th><th class="r">Imposto previsto</th><th class="r">Acumulado</th></tr></thead><tbody>
      ${toPay.map((x) => { run += x.pay + x.taxP; return html`<tr key=${x.o.id} style="cursor:pointer" onClick=${() => go("pedido", { id: x.o.id })}><td>${fdate(x.o.expectedDate)}</td><td><span class="num">#${x.o.number}</span> ${x.o.title}</td>
        <td class="r">${x.pay > 0 ? money(x.pay) : "—"}</td><td class="r">${x.taxP > 0 ? money(x.taxP) : "—"}</td><td class="r"><strong>${money(run)}</strong></td></tr>`; })}
      </tbody></table></div>` : html`<div class="empty">Nada a pagar.</div>`}<//>`;
}

// ---------------- Alertas ----------------
function alertsFor(o, t, r, today) {
  const a = [];
  const open = !CLOSED.includes(o.status);
  if (o.needsReview) a.push(["p-warn", "Revisar"]);
  if (t.taxAwaiting) a.push(["p-acc", "Imposto a lançar"]);
  if (r.status === "divergencia") a.push(["p-bad", "Divergência"]);
  if (open && ["enviado", "em_transporte"].includes(o.status) && !(o.trackings || []).length) a.push(["p-warn", "Enviado sem rastreio"]);
  const stale = open ? (o.trackings || []).filter((k) => !k.received && k.statusAt && daysBetween(k.statusAt.slice(0, 10), today) >= 10) : [];
  if (stale.length) a.push(["p-warn", stale.length + " rastreio(s) parado(s) há 10+ dias"]);
  if (open && t.pending > 0.01 && o.expectedDate && daysBetween(today, o.expectedDate) <= 7) a.push(["p-bad", daysBetween(today, o.expectedDate) < 0 ? "Previsão passou e tem saldo a pagar" : "Chega em até 7 dias com saldo a pagar"]);
  return a;
}

// ---------------- Histórico ----------------
function fdatetime(iso) { if (!iso) return "—"; const d = new Date(iso); return new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).format(d); }
function History({ ctx, o }) {
  const list = [...(o.history || [])].reverse();
  const [names, setNames] = useState({});
  const [all, setAll] = useState(false);
  const ids = [...new Set(list.map((x) => x.by).filter(Boolean))];
  useEffect(() => {
    if (!ids.length || !ctx.st.user) return;
    let alive = true;
    ctx.st.user.profiles(ids).then((ps) => { if (alive) setNames(Object.fromEntries(Object.entries(ps || {}).map(([k, p]) => [k, p?.name || ""]))); }).catch(() => {});
    return () => { alive = false; };
  }, [ids.join(",")]);
  const who = (by) => (by && by === ctx.st.meId ? "Você" : names[by] || "Alguém");
  const shown = all ? list : list.slice(0, 8);
  return html`<${Card} title=${"Histórico de alterações (" + list.length + ")"}>
    ${list.length ? html`<div class="list">${shown.map((x, i) => html`<div class="li" key=${x.at + i} style="align-items:flex-start"><div style="min-width:0"><div>${x.what}</div><div class="small muted">${fdatetime(x.at)} · ${who(x.by)}</div></div></div>`)}</div>
      ${list.length > 8 ? html`<div><button class="link" onClick=${() => setAll(!all)}>${all ? "Mostrar menos" : "Mostrar tudo"}</button></div>` : null}`
      : html`<div class="empty">As alterações feitas a partir de agora aparecem aqui, com data, hora e quem fez.</div>`}
  <//>`;
}

// ---------------- Comprovantes (anexos) ----------------
const FILE_TYPES = /^(image\/(png|jpeg|gif|webp|heic|heif)|application\/pdf)$/;
async function uploadAll(assets, files) {
  const out = [];
  for (const f of files) {
    const type = FILE_TYPES.test(f.type) ? f.type : /\.pdf$/i.test(f.name) ? "application/pdf" : /\.jpe?g$/i.test(f.name) ? "image/jpeg" : /\.png$/i.test(f.name) ? "image/png" : f.type || undefined;
    const r = await assets.upload(f, type ? { type } : undefined);
    out.push({ id: r.id, name: f.name || "comprovante", type: r.contentType });
  }
  return out;
}
const uploadErr = (e) => ({ too_large: "Arquivo grande demais (máx. 20 MB).", unsupported_type: "Tipo de arquivo não aceito. Use foto (JPG/PNG) ou PDF.", quota_exceeded: "Espaço de arquivos do app cheio." }[e?.code] || "Não foi possível anexar o comprovante.");
function removeAssets(ctx, files) { const a = ctx.st.assets; if (!a) return; for (const f of files || []) a.delete(f.id).catch(() => {}); }
function FileLinks({ files }) {
  return (files || []).length ? html`<div class="row" style="gap:6px;margin-top:2px">${files.map((f) => html`<a key=${f.id} class="clip" href=${"/_blob/" + f.id} target="_blank" rel="noopener">📎 ${f.name}</a>`)}</div>` : null;
}
function AttachPicker({ ctx, kept, setKept, picked, setPicked }) {
  if (!ctx.st.assets) return kept.length ? html`<${FileLinks} files=${kept} />` : null;
  return html`<div class="f span-all"><span class="small muted">Comprovantes (foto ou PDF) — opcional</span>
    <div class="row" style="gap:6px">
      ${kept.map((f) => html`<span class="clip" key=${f.id}><a href=${"/_blob/" + f.id} target="_blank" rel="noopener">📎 ${f.name}</a><button type="button" class="x" aria-label="Remover" onClick=${() => setKept(kept.filter((x) => x.id !== f.id))}>×</button></span>`)}
      ${picked.map((f, i) => html`<span class="clip" key=${"n" + i}>📎 ${f.name}<button type="button" class="x" aria-label="Remover" onClick=${() => setPicked(picked.filter((_, j) => j !== i))}>×</button></span>`)}
      <label class="btn sm">+ Anexar<input type="file" accept="image/*,application/pdf" multiple style="display:none" onChange=${(e) => { setPicked([...picked, ...Array.from(e.target.files || [])]); e.target.value = ""; }} /></label>
    </div></div>`;
}

// ---------------- Restaurar backup ----------------
function Restore({ ctx }) {
  const { D, api, isAdmin, notify } = ctx;
  const [bk, setBk] = useState(null);
  const [err, setErr] = useState(null);
  const [prog, setProg] = useState(null);
  async function onFile(e) {
    setErr(null); setBk(null); setProg(null);
    const f = e.target.files?.[0]; e.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data || !Array.isArray(data.orders)) throw new Error("formato");
      const cols = Object.keys(COLS).filter((c) => Array.isArray(data[c]));
      for (const c of cols) if (data[c].some((d) => !d || typeof d.id !== "string" || !d.id)) throw new Error("formato");
      setBk({ name: f.name, data, cols });
    } catch (x) { setErr("Esse arquivo não é um backup válido deste app."); }
  }
  async function run() {
    const jobs = [];
    for (const c of bk.cols) for (const d of bk.data[c]) { const { id, ...body } = d; jobs.push([c, id, body]); }
    setProg({ done: 0, total: jobs.length });
    try {
      for (let i = 0; i < jobs.length; i++) { await api.saveEntity(...jobs[i]); setProg({ done: i + 1, total: jobs.length }); }
      notify("Backup restaurado."); setBk(null);
    } catch (x) { console.error(x); setErr("A restauração parou no meio (" + (x?.code || "erro") + "). Tente de novo: o que já foi gravado continua certo."); }
  }
  if (!isAdmin) return html`<p class="small muted" style="margin:0">Só o dono do app pode restaurar um backup.</p>`;
  const orders = bk ? bk.data.orders : [];
  const same = orders.filter((o) => D.orders.some((x) => x.id === o.id)).length;
  return html`<div style="display:grid;gap:10px">
    <strong>Restaurar backup</strong>
    <p class="small muted" style="margin:0">Carrega um arquivo baixado acima. Pedidos e cadastros do arquivo substituem os de mesmo registro no app e os que faltam são recriados. Nada que está só no app é apagado.</p>
    <div><label class="btn">Escolher arquivo de backup<input type="file" accept=".json,application/json" style="display:none" onChange=${onFile} /></label></div>
    ${err ? html`<div class="err">${err}</div>` : null}
    ${bk ? html`<div class="banner b-warn" style="display:grid;gap:8px">
      <div><strong>${bk.name}</strong>${bk.data.exportedAt ? " — gerado em " + fdatetime(bk.data.exportedAt) : ""}</div>
      <div class="small">${bk.cols.map((c) => bk.data[c].length + " " + ({ orders: "pedidos", suppliers: "fornecedores", products: "produtos", modes: "modalidades", carriers: "transportadoras", methods: "formas de pagamento", rates: "cotações", settings: "configurações" }[c] || c)).join(" · ")}</div>
      <div class="small">${same} pedido(s) já existem e voltarão a ficar como no backup; ${orders.length - same} serão recriados. Alterações feitas nesses pedidos depois do backup serão perdidas.</div>
      <div class="small">Dica: baixe um backup atual antes de restaurar.</div>
      ${prog ? html`<div class="small">Gravando ${prog.done} de ${prog.total}…</div>` : html`<div class="row"><button class="btn pri" id="restore-go" onClick=${run}>Restaurar agora</button><button class="btn" onClick=${() => setBk(null)}>Cancelar</button></div>`}
    </div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
