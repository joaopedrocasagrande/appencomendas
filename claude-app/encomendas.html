<script>
(function () {
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback } = React;
// Permite escrever style="a:b;c:d" nos modelos (o React exige objeto).
function cssToObj(css) {
  const o = {};
  for (const part of String(css).split(";")) {
    const i = part.indexOf(":");
    if (i < 0) continue;
    const k = part.slice(0, i).trim(), v = part.slice(i + 1).trim();
    if (!k) continue;
    o[k.startsWith("--") ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = v;
  }
  return o;
}
function h(type, props, ...children) {
  if (props && typeof props.style === "string") props = { ...props, style: props.style ? cssToObj(props.style) : undefined };
  return React.createElement(type, props, ...children);
}
const html = htm.bind(h);
const SYM = (c) => (c === "USD" ? "$" : "R$");

// ---------------- Formatação ----------------
const fmtBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const fmtUSD = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "USD" });
function money(v, cur = "BRL") {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return cur === "USD" ? fmtUSD.format(v).replace("US$", "$") : fmtBRL.format(v);
}
function num(v, d = 2) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: d }).format(v);
}
function fdate(iso) { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${y}`; }
function parseDec(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s/g, "").replace(/^R\$|^US\$|^\$/, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function toInput(v) { if (v === null || v === undefined || v === "") return ""; const n = Number(v); return Number.isFinite(n) ? String(Math.round(n * 10000) / 10000).replace(".", ",") : ""; }
function today() { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date()); }
function addDays(iso, days) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const norm = (s) => (s || "").trim().replace(/\s+/g, " ");
const key = (s) => norm(s).toLowerCase();
const cx = (...a) => a.filter(Boolean).join(" ");

// ---------------- Rótulos ----------------
const ORDER_STATUS = { cotacao: "Cotação", confirmado: "Confirmado", em_producao: "Em produção", enviado: "Enviado", em_transporte: "Em transporte", recebido_parcial: "Recebido parcialmente", recebido: "Recebido", finalizado: "Finalizado", cancelado: "Cancelado" };
const ORDER_TONE = { cotacao: "", confirmado: "p-info", em_producao: "p-info", enviado: "p-warn", em_transporte: "p-info", recebido_parcial: "p-warn", recebido: "p-good", finalizado: "p-good", cancelado: "p-bad" };
const CLOSED = ["recebido", "finalizado", "cancelado"];
const TRK_STATUS = { aguardando_postagem: "Aguardando postagem", postado: "Postado", em_transito: "Em trânsito", fiscalizacao: "Fiscalização / Alfândega", aguardando_pagamento: "Aguardando pagamento de imposto", saiu_entrega: "Saiu para entrega", entregue: "Entregue", devolvido: "Devolvido", extraviado: "Extraviado" };
const TRK_TONE = { aguardando_postagem: "", postado: "p-info", em_transito: "p-info", fiscalizacao: "p-warn", aguardando_pagamento: "p-warn", saiu_entrega: "p-info", entregue: "p-good", devolvido: "p-bad", extraviado: "p-bad" };
const PAY_LABEL = { pendente: "Pagamento pendente", parcial: "Pago parcialmente", pago: "Pago", pago_a_mais: "Pago a mais" };
const PAY_TONE = { pendente: "p-bad", parcial: "p-warn", pago: "p-good", pago_a_mais: "p-info" };
const REC_LABEL = { nao_recebido: "Não recebido", parcial: "Recebido parcialmente", completo: "Recebido completo", divergencia: "Recebido com divergência" };
const REC_TONE = { nao_recebido: "", parcial: "p-warn", completo: "p-good", divergencia: "p-bad" };
const TAX_LABEL = { sem: "Sem imposto", incluso: "Incluso no pedido", por_fora: "Pago por fora" };
const TAX_HINT = { sem: "Este pedido não tem imposto.", incluso: "Já está dentro do valor pago ao fornecedor.", por_fora: "Pago depois, separado. Lance no pedido quando pagar." };
const VARIANTS = ["Masculino", "Feminino", "Infantil", "Kit Infantil", "Goleiro", "Manga longa"];
const SIZES = ["PP", "P", "M", "G", "GG", "XGG", "2XL", "3XL", "4XL"];

// ---------------- Cálculos ----------------
// Cotação usada quando o pedido não tem cotação própria (a de hoje; definida pelo App a cada render)
let FALLBACK_RATE = null;
function convert(amount, from, to, rate) { if (from === to) return amount; if (!rate) return null; return from === "USD" ? amount * rate : amount / rate; }
const n0 = (v) => (typeof v === "number" && Number.isFinite(v) ? v : 0);
const r2 = (v) => Math.round(v * 100) / 100;

function totals(o) {
  const cur = o.currency || "BRL";
  let orate = o.rate > 0 ? o.rate : FALLBACK_RATE;
  let missingRate = false;
  const to = (amt, from, rate, target) => { const v = convert(amt, from, target, rate || orate); if (v === null) { missingRate = true; return 0; } return v; };
  // Pagamento/imposto: se o valor convertido foi digitado (ou salvo), usa ele em vez de recalcular pela cotação
  const payTo = (p, target) => (p.currency === target ? n0(p.amount) : target === "BRL" && p.brlAmount != null ? n0(p.brlAmount) : target === "USD" && p.usdAmount != null ? n0(p.usdAmount) : to(n0(p.amount), p.currency, p.rate, target));
  const items = o.items || [], expenses = o.expenses || [], pays = o.payments || [], taxes = o.taxPayments || [];
  const pieces = items.reduce((s, i) => s + n0(i.pieces), 0);
  const itemsTotal = items.reduce((s, i) => s + n0(i.pieces) * n0(i.unitPrice), 0);
  const supplierExpenses = expenses.filter((e) => e.chargedBySupplier).reduce((s, e) => s + to(n0(e.amount), e.currency, null, cur), 0);
  const supplierTotal = r2(itemsTotal + n0(o.freight) - n0(o.discount) + supplierExpenses);
  // Pedido em dólar com total em reais digitado à mão: vale a cotação efetiva (só se o total em dólar não mudou desde então)
  const manualBRL = cur === "USD" && o.totalBRL > 0 && supplierTotal > 0 && Math.abs(n0(o.totalBRLFor) - supplierTotal) < 0.01;
  if (manualBRL) orate = o.totalBRL / supplierTotal;
  const paid = r2(pays.reduce((s, p) => s + payTo(p, cur), 0));
  const pending = r2(supplierTotal - paid);
  let payStatus = "pendente";
  if (supplierTotal <= 0 && paid <= 0) payStatus = "pendente";
  else if (pending < -0.01) payStatus = "pago_a_mais";
  else if (pending <= 0.01) payStatus = "pago";
  else if (paid > 0) payStatus = "parcial";
  const taxPaidBRL = r2(o.taxMode === "por_fora" ? taxes.reduce((s, t) => s + payTo(t, "BRL"), 0) : 0);
  const otherBRL = expenses.filter((e) => !e.chargedBySupplier).reduce((s, e) => s + to(n0(e.amount), e.currency, null, "BRL"), 0);
  const extrasBRL = r2(taxPaidBRL + otherBRL);
  const extrasPendingBRL = r2(expenses.filter((e) => !e.chargedBySupplier && !e.paid).reduce((s, e) => s + to(n0(e.amount), e.currency, null, "BRL"), 0));
  const taxAwaiting = o.taxMode === "por_fora" && taxes.length === 0 && !o.taxDone;
  // Previsão de imposto (em R$): o que falta pagar dela conta como "a pagar" até o imposto ser marcado como concluído
  const taxForecastBRL = o.taxMode === "por_fora" ? r2(n0(o.taxForecast)) : 0;
  const taxForecastPendingBRL = o.taxMode === "por_fora" && !o.taxDone ? r2(Math.max(taxForecastBRL - taxPaidBRL, 0)) : 0;
  const taxIncludedBRL = o.taxMode === "incluso" ? r2(to(n0(o.taxAmount), cur, null, "BRL")) : 0;
  const paidBRL = pays.reduce((s, p) => s + payTo(p, "BRL"), 0);
  const pendingBRL = to(Math.max(pending, 0), cur, null, "BRL");
  const landedBRL = r2(paidBRL + pendingBRL + extrasBRL + taxForecastPendingBRL);
  return {
    cur, orate, manualBRL, pieces, itemsTotal: r2(itemsTotal), freight: n0(o.freight), discount: n0(o.discount), supplierExpenses: r2(supplierExpenses),
    supplierTotal, supplierTotalBRL: r2(to(supplierTotal, cur, null, "BRL")), paid, paidBRL: r2(paidBRL), pending, pendingBRL: r2(pendingBRL), payStatus, taxPaidBRL, taxAwaiting, taxForecastBRL, taxForecastPendingBRL, taxDone: !!o.taxDone, taxTotalBRL: r2(taxPaidBRL + taxIncludedBRL),
    extrasBRL, extrasPendingBRL, landedBRL, costPerPiece: pieces > 0 ? landedBRL / pieces : null, missingRate,
  };
}
function receipt(o) {
  const items = o.items || [], trk = o.trackings || [];
  const expected = items.reduce((s, i) => s + n0(i.pieces), 0);
  const received = items.reduce((s, i) => s + n0(i.receivedQty), 0);
  const defective = items.reduce((s, i) => s + n0(i.defectiveQty), 0);
  const checked = items.some((i) => i.receivedQty !== null && i.receivedQty !== undefined);
  const pk = trk.filter((t) => t.received).length;
  let status;
  if (!checked && pk === 0) status = "nao_recebido";
  else if (defective > 0 || items.some((i) => n0(i.receivedQty) > n0(i.pieces))) status = "divergencia";
  else if (items.length && items.every((i) => n0(i.receivedQty) === n0(i.pieces))) status = "completo";
  else status = "parcial";
  return { status, expected, received, defective, missing: Math.max(expected - received, 0), pk, pt: trk.length };
}
// Valor em dólar: reais em destaque e o dólar pequeno ao lado
const toBRLv = (v, cur, rate) => (cur === "USD" ? convert(v, "USD", "BRL", rate || FALLBACK_RATE) : v);
function M(v, cur, rate, block) {
  if (cur !== "USD" || v === null || v === undefined) return money(v, cur);
  const b = toBRLv(v, cur, rate);
  if (b === null) return html`${money(v, "USD")}<span class=${cx("brl", block && "blk")}>sem cotação</span>`;
  return html`${money(b)}<span class=${cx("brl", block && "blk")}>${money(v, "USD")}</span>`;
}
// Campo de conversão (R$ <-> $): calculado pela cotação, mas pode ser digitado à mão
function useConv(init) {
  const [val, setVal] = useState(init != null ? toInput(init) : "");
  const [manual, setManual] = useState(init != null);
  return { val, setVal, manual, setManual, clear() { setVal(""); setManual(false); } };
}
const convAuto = (amount, from, target, rate) => { const a = parseDec(amount), r = parseDec(rate); return a && r ? r2(convert(a, from, target, r)) : null; };
// Carrega o valor convertido de um lançamento salvo (edição)
function convLoad(cv, x, target) {
  const saved = target === "BRL" ? x.brlAmount : x.usdAmount;
  const auto = x.rate ? r2(convert(x.amount, x.currency, target, x.rate)) : null;
  if (saved != null && (auto === null || Math.abs(saved - auto) > 0.009)) { cv.setVal(toInput(saved)); cv.setManual(true); } else cv.clear();
}
// Resultado para salvar: cotação efetiva + valor convertido
function convResult(a, from, target, r, cv) {
  const m = cv.manual ? parseDec(cv.val) : null;
  if (m && m > 0) {
    const rate = target === "BRL" ? m / a : a / m;
    return { rate, brlAmount: target === "BRL" ? m : a, usdAmount: target === "USD" ? m : a };
  }
  if (!r) return null;
  const c = r2(convert(a, from, target, r));
  return { rate: r, brlAmount: target === "BRL" ? c : a, usdAmount: target === "USD" ? c : a };
}
function convField(cv, amount, from, target, rate, id, label) {
  const auto = convAuto(amount, from, target, rate);
  const a = parseDec(amount), m = parseDec(cv.val);
  const eff = cv.manual && a && m ? (target === "BRL" ? m / a : a / m) : null;
  return html`<${Field} label=${label || (target === "BRL" ? "Valor em reais" : "Equivale em dólar")} hint=${cv.manual
      ? html`Digitado à mão${eff ? " · cotação efetiva " + money(eff) : ""} · <button type="button" class="link" onClick=${() => cv.clear()}>calcular pela cotação</button>`
      : "Calculado pela cotação. Pode editar se não bater."}>
    <span class="money" data-sym=${SYM(target)}><input id=${id} inputmode="decimal" value=${cv.manual ? cv.val : auto === null ? "" : toInput(auto)} placeholder="0,00"
      onInput=${(e) => { cv.setVal(e.target.value); cv.setManual(e.target.value.trim() !== ""); }} /></span><//>`;
}

// Dica para campos digitados em dólar: "= R$ X"
const brlHint = (val, cur, rate) => { if (cur !== "USD") return null; const v = parseDec(val); if (!v) return null; const b = toBRLv(v, "USD", rate); return b === null ? "Defina a cotação para ver em reais" : "= " + money(b); };
const isLate = (o) => !!o.expectedDate && o.expectedDate < today() && !CLOSED.includes(o.status);
function rateFor(rates, day) {
  let best = null;
  for (const r of rates) if (r.id <= day && (!best || r.id > best.id)) best = r;
  return best;
}
function trackingLink(code, carrier) {
  const c = encodeURIComponent(code.trim());
  if (carrier && carrier.trackingUrl && carrier.trackingUrl.includes("{code}")) return carrier.trackingUrl.replace("{code}", c);
  return "https://t.17track.net/pt#nums=" + c;
}

// Fila por documento: uma escrita de cada vez no mesmo documento.
const queues = new Map();
function queued(path, fn) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  queues.set(path, next);
  return next;
}

function useStore() {
  const [st, setSt] = useState({ ready: false, db: null, noDb: false, canWrite: true, isAdmin: false, data: { orders: [], suppliers: [], products: [], modes: [], carriers: [], methods: [], rates: [] }, loaded: {} });
  useEffect(() => {
    let unsubs = [], alive = true;
    (async () => {
      const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
      if (!alive) return;
      if (!db) { setSt((s) => ({ ...s, ready: true, noDb: true })); return; }
      let canWrite = true, isAdmin = false;
      try { const w = await user?.can("data.write"); if (w === false) canWrite = false; } catch (e) {}
      try { isAdmin = !!((await user?.canEdit()) || (await user?.isOwner())); } catch (e) {}
      setSt((s) => ({ ...s, ready: true, db, canWrite, isAdmin }));
      for (const name of Object.keys(COLS)) {
        const u = db.collection(COLS[name]).onSnapshot(
          (snap) => {
            const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setSt((s) => ({ ...s, data: { ...s.data, [name]: rows }, loaded: { ...s.loaded, [name]: true } }));
          },
          (e) => console.error("db", name, e),
        );
        unsubs.push(u);
      }
    })();
    return () => { alive = false; unsubs.forEach((u) => u()); };
  }, []);
  return st;
}

function makeApi(db) {
  const col = (c) => db.collection(c);
  return {
    async saveOrder(id, body) { const path = "orders/" + id; return queued(path, () => col("orders").doc(id).set(body)); },
    async patchOrder(id, patch) { const path = "orders/" + id; return queued(path, () => col("orders").doc(id).update({ ...patch, updatedAt: new Date().toISOString() })); },
    async deleteOrder(id) { return queued("orders/" + id, () => col("orders").doc(id).delete()); },
    async saveEntity(c, id, body) { return queued(c + "/" + id, () => col(c).doc(id).set(body)); },
    async deleteEntity(c, id) { return queued(c + "/" + id, () => col(c).doc(id).delete()); },
    async setRate(day, value) { return queued("rates/" + day, () => col("rates").doc(day).set({ usdBrl: value, updatedAt: new Date().toISOString() })); },
    async deleteRate(day) { return queued("rates/" + day, () => col("rates").doc(day).delete()); },
  };
}

// Encontra um cadastro pelo nome (sem diferenciar maiúsculas) ou cria na hora.
async function resolveName(api, list, c, name) {
  const n = norm(name);
  if (!n) return null;
  const found = list.find((x) => key(x.name) === key(n));
  if (found) return found.id;
  const id = uid();
  await api.saveEntity(c, id, { name: n, createdAt: new Date().toISOString() });
  return id;
}

function Painel({ ctx }) {

function filterOrders(D, byId, f) {
  const q = key(f.q);
  return D.orders.map((o) => ({ o, t: totals(o), r: receipt(o), late: isLate(o) })).filter(({ o, t, r, late }) => {
    if (q) {
      const hay = [o.title, o.notes, byId.suppliers[o.supplierId]?.name, ...(o.trackings || []).map((x) => x.code), ...(o.items || []).map((i) => byId.products[i.productId]?.name)].map(key).join(" | ");
      if (!hay.includes(q)) return false;
    }
    if (f.fornecedor && o.supplierId !== f.fornecedor) return false;
    if (f.modalidade && o.modeId !== f.modalidade) return false;
    if (f.transportadora && o.carrierId !== f.transportadora) return false;
    if (f.status === "abertos" && CLOSED.includes(o.status)) return false;
    if (f.status && f.status !== "abertos" && o.status !== f.status) return false;
    if (f.de && (!o.orderDate || o.orderDate < f.de)) return false;
    if (f.ate && (!o.orderDate || o.orderDate > f.ate)) return false;
    if (f.pagamento === "em_aberto" && !(t.pending > 0.01)) return false;
    if (f.pagamento && f.pagamento !== "em_aberto" && t.payStatus !== f.pagamento) return false;
    if (f.recebimento && r.status !== f.recebimento) return false;
    if (f.situacao === "atrasados" && !late) return false;
    if (f.situacao === "revisao" && !o.needsReview) return false;
    if (f.situacao === "imposto" && !t.taxAwaiting) return false;
    if (f.situacao === "imposto_previsto" && !(t.taxForecastPendingBRL > 0)) return false;
    if (f.situacao === "a_pagar" && !(t.pending > 0.01 || t.taxForecastPendingBRL > 0)) return false;
    return true;
  });
}

const SORTS = [
  ["recentes", "Mais recentes"],
  ["antigos", "Mais antigos"],
  ["aberto", "Maior valor em aberto"],
  ["total", "Maior valor total"],
  ["pecas", "Mais peças"],
  ["chegada", "Chegada mais próxima"],
  ["atraso", "Mais atrasados"],
  ["pago", "Mais pago (%)"],
  ["fornecedor", "Fornecedor (A–Z)"],
  ["status", "Etapa do pedido"],
  ["numero", "Nº do pedido"],
];
const STATUS_ORDER = Object.keys(ORDER_STATUS);
function sortOrders(list, mode, inverted, byId, rate) {
  // Valores em dólar comparados em reais (cotação do pedido ou a de hoje)
  const brl = (v, x) => (x.t.cur === "USD" ? v * (x.t.orate || 1) : v);
  const date = (d, empty) => d || empty;
  const byNumDesc = (a, b) => (b.o.number || 0) - (a.o.number || 0);
  const cmp = {
    recentes: (a, b) => date(b.o.orderDate, "").localeCompare(date(a.o.orderDate, "")) || byNumDesc(a, b),
    antigos: (a, b) => date(a.o.orderDate, "9999").localeCompare(date(b.o.orderDate, "9999")) || -byNumDesc(a, b),
    aberto: (a, b) => brl(Math.max(b.t.pending, 0), b) - brl(Math.max(a.t.pending, 0), a) || byNumDesc(a, b),
    total: (a, b) => brl(b.t.supplierTotal, b) - brl(a.t.supplierTotal, a) || byNumDesc(a, b),
    pecas: (a, b) => b.t.pieces - a.t.pieces || byNumDesc(a, b),
    chegada: (a, b) => (CLOSED.includes(a.o.status) - CLOSED.includes(b.o.status)) || date(a.o.expectedDate, "9999").localeCompare(date(b.o.expectedDate, "9999")) || byNumDesc(a, b),
    atraso: (a, b) => (b.late - a.late) || date(a.o.expectedDate, "9999").localeCompare(date(b.o.expectedDate, "9999")) || byNumDesc(a, b),
    pago: (a, b) => (b.t.supplierTotal > 0 ? b.t.paid / b.t.supplierTotal : 0) - (a.t.supplierTotal > 0 ? a.t.paid / a.t.supplierTotal : 0) || byNumDesc(a, b),
    fornecedor: (a, b) => (byId.suppliers[a.o.supplierId]?.name || "~").localeCompare(byId.suppliers[b.o.supplierId]?.name || "~", "pt-BR") || byNumDesc(a, b),
    status: (a, b) => STATUS_ORDER.indexOf(a.o.status) - STATUS_ORDER.indexOf(b.o.status) || byNumDesc(a, b),
    numero: byNumDesc,
  }[mode] || byNumDesc;
  const out = [...list].sort(cmp);
  return inverted ? out.reverse() : out;
}
