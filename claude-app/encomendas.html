  }
  const totIn = {
    currency: cur, rate: parseDec(f.rate), freight: parseDec(f.freight), discount: parseDec(f.discount), taxMode: f.taxMode, taxAmount: parseDec(f.taxAmount), taxForecast: parseDec(f.taxForecast),
    items: items.map((i) => ({ pieces: parseDec(i.pieces) || 0, unitPrice: parseDec(i.unitPrice) || 0 })),
    expenses: expenses.map((e) => ({ amount: parseDec(e.amount) || 0, currency: e.currency, chargedBySupplier: e.chargedBySupplier, paid: e.paid })), payments: [], taxPayments: [],
  };
  const tot0 = totals(totIn);
  const mTot = cur === "USD" && cvTotal.manual ? parseDec(cvTotal.val) : null;
  const tot = mTot > 0 ? totals({ ...totIn, totalBRL: mTot, totalBRLFor: tot0.supplierTotal }) : tot0;

  async function save() {
    setErr(null);
    if (!norm(title)) return setErr("Informe o título do pedido (ou o fornecedor e a modalidade).");
    if (items.some((i) => !norm(i.product))) return setErr("Informe o produto de todos os itens.");
    if (expenses.some((e) => !norm(e.description))) return setErr("Informe a descrição de todas as despesas.");
    const rate = parseDec(f.rate);
    if ((cur === "USD" || expenses.some((e) => e.currency !== cur)) && !rate) return setErr("Informe a cotação do dólar do pedido.");
    setBusy(true);
    try {
      const supplierId = await resolveName(api, D.suppliers, "suppliers", f.supplier);
      const modeId = await resolveName(api, D.modes, "modes", f.mode);
      const carrierId = await resolveName(api, D.carriers, "carriers", f.carrier);
      const prodIds = {};
      for (const i of items) { const k = key(i.product); if (!prodIds[k]) prodIds[k] = await resolveName(api, D.products.concat(Object.entries(prodIds).map(([kk, v]) => ({ id: v, name: kk }))), "products", i.product); }
      const oid = existing ? existing.id : uid();
      const now = new Date().toISOString();
      const body = {
        ...(existing || {}),
        number: existing ? existing.number : Math.max(0, ...D.orders.map((o) => o.number || 0)) + 1,
        title: norm(title), supplierId, orderDate: f.orderDate || null, expectedDate: f.expectedDate || null, modeId, carrierId,
        currency: cur, rate: rate || null, freight: parseDec(f.freight) || 0, discount: parseDec(f.discount) || 0,
        ...(() => { const m = cur === "USD" && cvTotal.manual ? parseDec(cvTotal.val) : null; return m > 0 && tot.supplierTotal > 0 ? { totalBRL: r2(m), totalBRLFor: tot.supplierTotal } : { totalBRL: null, totalBRLFor: null }; })(),
        taxMode: f.taxMode, taxAmount: f.taxMode === "incluso" ? parseDec(f.taxAmount) || 0 : 0, taxForecast: f.taxMode === "por_fora" ? parseDec(f.taxForecast) || 0 : 0, status: f.status, notes: f.notes.trim() || null, needsReview: f.needsReview,
        items: items.map((i) => {
          let sizes = null;
          if (i.sizes?.length) { sizes = {}; for (const s of i.sizes) { const q = parseDec(s.qty); if (s.size && q) sizes[s.size] = (sizes[s.size] || 0) + Math.round(q); } if (!Object.keys(sizes).length) sizes = null; }
          const old = existing?.items?.find((x) => x.id === i.id) || {};
          return { id: i.id, productId: prodIds[key(i.product)], variant: norm(i.variant) || null, boxes: parseDec(i.boxes), ppb: parseDec(i.ppb), grids: parseDec(i.grids), ppg: parseDec(i.ppg), pieces: Math.round(parseDec(i.pieces) || 0), unitPrice: parseDec(i.unitPrice) || 0, sizes,
            receivedQty: old.receivedQty ?? null, defectiveQty: old.defectiveQty ?? null, checkNotes: old.checkNotes ?? null, receivedSizes: old.receivedSizes ?? null };
        }),
        expenses: expenses.map((e) => ({ id: e.id, description: norm(e.description), amount: parseDec(e.amount) || 0, currency: e.currency, chargedBySupplier: !!e.chargedBySupplier, paid: e.chargedBySupplier ? false : !!e.paid })),
        payments: existing?.payments || [], taxPayments: existing?.taxPayments || [], trackings: existing?.trackings || [],
        createdAt: existing?.createdAt || now, updatedAt: now,
      };
      delete body.id;
      await api.saveOrder(oid, body);
      notify("Pedido salvo.");
      go("pedido", { id: oid });
    } catch (e) { console.error(e); setErr(e?.code === "quota_exceeded" ? "O banco do app está cheio. Exclua pedidos antigos." : "Não foi possível salvar. Tente de novo."); }
    setBusy(false);
  }

  return html`
    <datalist id="dl-sup">${D.suppliers.map((s) => html`<option key=${s.id} value=${s.name} />`)}</datalist>
    <datalist id="dl-prod">${D.products.map((s) => html`<option key=${s.id} value=${s.name} />`)}</datalist>
    <datalist id="dl-mode">${D.modes.map((s) => html`<option key=${s.id} value=${s.name} />`)}</datalist>
    <datalist id="dl-car">${D.carriers.map((s) => html`<option key=${s.id} value=${s.name} />`)}</datalist>
    <datalist id="dl-var">${VARIANTS.map((v) => html`<option key=${v} value=${v} />`)}</datalist>
    <datalist id="dl-size">${SIZES.map((v) => html`<option key=${v} value=${v} />`)}</datalist>
    <${Head} title=${existing ? "Editar pedido #" + existing.number : "Novo pedido"} back=${() => (existing ? go("pedido", { id }) : go("pedidos"))} />
    <${Card} title="Dados do pedido"><div class="grid g3">
      <${Field} label="Título do pedido" className="span-all" hint=${titleTouched ? (autoTitle && norm(f.title) !== autoTitle ? html`<button type="button" class="link" onClick=${() => { set("title", ""); setTitleTouched(false); }}>Usar "${autoTitle}"</button>` : null) : "Preenchido com fornecedor + modalidade. Pode editar."}><input id="f-title" value=${title} placeholder="Fornecedor - Modalidade" onInput=${(e) => { set("title", e.target.value); setTitleTouched(e.target.value !== ""); }} /><//>
      <${Field} label="Fornecedor" hint="Digite um nome novo para cadastrar na hora."><input id="f-sup" list="dl-sup" value=${f.supplier} onInput=${(e) => set("supplier", e.target.value)} /><//>
      <${Field} label="Status do pedido"><select id="f-status" value=${f.status} onChange=${(e) => set("status", e.target.value)}>${Object.entries(ORDER_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
      <${Field} label="Data do pedido"><input id="f-date" type="date" value=${f.orderDate} onChange=${(e) => onDate(e.target.value)} /><//>
      <${Field} label="Modalidade de transporte"><input id="f-mode" list="dl-mode" value=${f.mode} onInput=${(e) => set("mode", e.target.value)} onBlur=${(e) => suggestExpected(f.orderDate, e.target.value)} /><//>
      <${Field} label="Transportadora"><input id="f-car" list="dl-car" value=${f.carrier} onInput=${(e) => set("carrier", e.target.value)} /><//>
      <${Field} label="Previsão de recebimento"><input id="f-exp" type="date" value=${f.expectedDate} onChange=${(e) => set("expectedDate", e.target.value)} /><//>
      <${Field} label="Moeda do pedido"><select id="f-cur" value=${cur} onChange=${(e) => set("currency", e.target.value)}><option value="BRL">Real (R$)</option><option value="USD">Dólar ($)</option></select><//>
      <${Field} label="Cotação do pedido ($1 = R$)" hint="Sugerida pela cotação do dia do pedido."><span class="money" data-sym="R$"><input id="f-rate" inputmode="decimal" value=${f.rate} onInput=${(e) => { setRateTouched(true); set("rate", e.target.value); }} /></span><//>
    </div><//>

    <${Card} title=${"Itens (" + items.length + ")"} actions=${html`<button class="btn" onClick=${() => setItems((l) => [...l, emptyItem()])}>+ Item</button>`}>
      ${items.map((i, idx) => {
        const s = suggested(i), tp = parseDec(i.pieces) || 0, sum = i.sizes ? i.sizes.reduce((a, x) => a + (parseDec(x.qty) || 0), 0) : 0;
        return html`<div class="itembox" key=${i.id}>
          <div class="row between"><strong class="small muted">ITEM ${idx + 1}</strong>${items.length > 1 ? html`<button class="link" style="color:var(--bad)" onClick=${() => setItems((l) => l.filter((x) => x.id !== i.id))}>Remover</button>` : null}</div>
          <div class="grid g2">
            <${Field} label="Produto"><input id=${"p-" + i.id} list="dl-prod" value=${i.product} onInput=${(e) => upItem(i.id, { product: e.target.value })} placeholder="Digite ou escolha" /><//>
            <${Field} label="Variação"><input id=${"v-" + i.id} list="dl-var" value=${i.variant || ""} onInput=${(e) => upItem(i.id, { variant: e.target.value })} /><//>
            <${Field} label="Caixas"><input id=${"b-" + i.id} inputmode="decimal" value=${i.boxes} onInput=${(e) => upItem(i.id, { boxes: e.target.value })} /><//>
            <${Field} label="Peças/caixa"><input id=${"pb-" + i.id} inputmode="decimal" value=${i.ppb} onInput=${(e) => upItem(i.id, { ppb: e.target.value })} /><//>
            <${Field} label="Grades"><input id=${"g-" + i.id} inputmode="decimal" value=${i.grids} onInput=${(e) => upItem(i.id, { grids: e.target.value })} /><//>
            <${Field} label="Peças/grade"><input id=${"pg-" + i.id} inputmode="decimal" value=${i.ppg} onInput=${(e) => upItem(i.id, { ppg: e.target.value })} /><//>
            <${Field} label="Total de peças" hint=${s !== null && s !== tp ? html`<button class="link" onClick=${(e) => { e.preventDefault(); upItem(i.id, { pieces: String(s) }); }}>Calculado: ${s}. Usar</button>` : null}><input id=${"t-" + i.id} inputmode="numeric" value=${i.pieces} onInput=${(e) => upItem(i.id, { pieces: e.target.value })} style="font-weight:600" /><//>
            <${Field} label="Valor unit." hint=${brlHint(i.unitPrice, cur, frate)}><span class="money" data-sym=${SYM(cur)}><input id=${"u-" + i.id} inputmode="decimal" value=${i.unitPrice} onInput=${(e) => upItem(i.id, { unitPrice: e.target.value })} /></span><//>
          </div>
          <div class="row between"><button class="link" onClick=${() => upItem(i.id, { sizes: i.sizes ? null : ["P", "M", "G", "GG", "XGG"].map((size) => ({ size, qty: "" })) })}>${i.sizes ? "Não controlar tamanhos" : "Controlar tamanhos (opcional)"}</button><strong class="tab">Total: ${M(tp * (parseDec(i.unitPrice) || 0), cur, frate)}</strong></div>
          ${i.sizes ? html`<div class="sizes">${i.sizes.map((sz, k) => html`<div class="sz" key=${k}>
              <input list="dl-size" value=${sz.size} aria-label="Tamanho" onInput=${(e) => upItem(i.id, { sizes: i.sizes.map((x, j) => (j === k ? { ...x, size: e.target.value } : x)) })} />
              <input inputmode="numeric" placeholder="qtd" value=${sz.qty} aria-label="Quantidade" onInput=${(e) => upItem(i.id, { sizes: i.sizes.map((x, j) => (j === k ? { ...x, qty: e.target.value } : x)) })} /></div>`)}
            <button class="btn sm" onClick=${() => upItem(i.id, { sizes: [...i.sizes, { size: "", qty: "" }] })}>+ tamanho</button>
            <div class="small" style=${"width:100%;" + (sum && sum !== tp ? "color:var(--warn)" : "")}>Soma dos tamanhos: ${sum}${sum > 0 && sum !== tp ? html` (diferente do total de ${tp}). <button class="link" onClick=${() => upItem(i.id, { pieces: String(sum) })}>Usar soma como total</button>` : null}</div></div>` : null}
        </div>`;
      })}
      <button class="btn" onClick=${() => setItems((l) => [...l, emptyItem()])}>+ Adicionar item</button>
    <//>

    <${Card} title="Frete, desconto e imposto">
      <div class="grid g2">
        <${Field} label="Frete" hint=${brlHint(f.freight, cur, frate)}><span class="money" data-sym=${SYM(cur)}><input id="f-fr" inputmode="decimal" value=${f.freight} onInput=${(e) => set("freight", e.target.value)} /></span><//>
        <${Field} label="Desconto" hint=${brlHint(f.discount, cur, frate)}><span class="money" data-sym=${SYM(cur)}><input id="f-ds" inputmode="decimal" value=${f.discount} onInput=${(e) => set("discount", e.target.value)} /></span><//>
        ${cur === "USD" ? convField(cvTotal, tot.supplierTotal > 0 ? String(tot.supplierTotal) : "", "USD", "BRL", f.rate, "f-total-brl", "Total do pedido em reais (" + money(tot.supplierTotal, "USD") + ")") : null}
      </div>
      <div class="radios">${Object.keys(TAX_LABEL).map((m) => html`<label key=${m} class=${cx("radio", f.taxMode === m && "on")}><input type="radio" name="taxMode" checked=${f.taxMode === m} onChange=${() => set("taxMode", m)} /><span><strong>${TAX_LABEL[m]}</strong><div class="small muted">${TAX_HINT[m]}</div></span></label>`)}</div>
      ${f.taxMode === "incluso" ? html`<${Field} label="Valor do imposto incluso — opcional" hint=${brlHint(f.taxAmount, cur, frate)}><span class="money" data-sym=${SYM(cur)}><input id="f-tx" inputmode="decimal" value=${f.taxAmount} onInput=${(e) => set("taxAmount", e.target.value)} /></span><//>` : null}
      ${f.taxMode === "por_fora" ? html`<div class="grid g2">
        <${Field} label="Imposto previsto — opcional" hint="Quanto você espera pagar de imposto. Entra no painel como imposto a pagar até você marcar o imposto como concluído."><span class="money" data-sym="R$"><input id="f-txf" inputmode="decimal" value=${f.taxForecast} onInput=${(e) => set("taxForecast", e.target.value)} placeholder="0,00" /></span><//>
      </div>` : null}
    <//>

    <${Card} title="Outras despesas" actions=${html`<button class="btn" onClick=${() => setExpenses((l) => [...l, { id: uid(), description: "", amount: "", currency: cur, chargedBySupplier: true, paid: false }])}>+ Despesa</button>`}>
      ${expenses.length === 0 ? html`<p class="muted small" style="margin:0">Taxas, envio interno, despachante etc. Nenhuma despesa lançada.</p>` : expenses.map((e) => html`<div class="itembox" key=${e.id}>
        <div class="grid g2">
          <${Field} label="Descrição"><input value=${e.description} onInput=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, description: ev.target.value } : x)))} /><//>
          <${Field} label="Valor" hint=${brlHint(e.amount, e.currency, frate)}><span class="money" data-sym=${SYM(e.currency)}><input inputmode="decimal" value=${e.amount} onInput=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, amount: ev.target.value } : x)))} /></span><//>
          <${Field} label="Moeda"><select value=${e.currency} onChange=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, currency: ev.target.value } : x)))}><option value="BRL">R$</option><option value="USD">$</option></select><//>
        </div>
        <div class="row between"><div class="row">
          <label class="chk"><input type="checkbox" checked=${e.chargedBySupplier} onChange=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, chargedBySupplier: ev.target.checked } : x)))} />Cobrada pelo fornecedor</label>
          ${!e.chargedBySupplier ? html`<label class="chk"><input type="checkbox" checked=${e.paid} onChange=${(ev) => setExpenses((l) => l.map((x) => (x.id === e.id ? { ...x, paid: ev.target.checked } : x)))} />Já paga</label>` : null}</div>
          <button class="link" style="color:var(--bad)" onClick=${() => setExpenses((l) => l.filter((x) => x.id !== e.id))}>Remover</button></div>
      </div>`)}
    <//>

    <${Card} title="Observações">
      <textarea id="f-notes" rows="3" value=${f.notes} onInput=${(e) => set("notes", e.target.value)}></textarea>
      <label class="chk"><input type="checkbox" checked=${f.needsReview} onChange=${(e) => set("needsReview", e.target.checked)} />Marcar como "precisa de revisão"</label>
    <//>

    <div class="sticky-foot">
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        <div><div class="small muted">Peças</div><strong class="tab">${num(tot.pieces, 0)}</strong></div>
        <div><div class="small muted">Produtos</div><strong class="tab">${M(tot.itemsTotal, cur, tot.orate, true)}</strong></div>
        <div><div class="small muted">Total ao fornecedor</div><strong class="tab" style="color:var(--accent)">${M(tot.supplierTotal, cur, tot.orate, true)}</strong></div>
        <div><div class="small muted">Despesas à parte</div><strong class="tab">${money(tot.extrasBRL)}</strong></div>
        ${tot.taxForecastBRL > 0 ? html`<div><div class="small muted">Imposto previsto</div><strong class="tab">${money(tot.taxForecastBRL)}</strong></div>` : null}
      </div>
      ${err ? html`<div class="banner b-bad">${err}</div>` : null}
      <div class="row"><button class="btn pri" disabled=${busy || !ctx.canWrite} onClick=${save}>${busy ? "Salvando…" : "Salvar pedido"}</button><button class="btn" onClick=${() => (existing ? go("pedido", { id }) : go("pedidos"))}>Cancelar</button></div>
    </div>`;
}

// ---------------- Detalhe do pedido ----------------
function OrderDetail({ ctx, id }) {
  const { D, byId, api, go, notify, isAdmin, canWrite, today: t, curRate } = ctx;
  const o = D.orders.find((x) => x.id === id);
  if (!o) return html`<${Head} title="Pedido não encontrado" back=${() => go("pedidos")} /><div class="card"><div class="empty">${ctx.st.loaded.orders ? "Esse pedido foi excluído ou não existe." : "Carregando…"}</div></div>`;
  const tt = totals(o), r = receipt(o), cur = tt.cur, late = isLate(o);
  const patch = async (p, msg) => { try { await api.patchOrder(o.id, p); if (msg) notify(msg); } catch (e) { console.error(e); notify("Não foi possível salvar. Tente de novo."); } };
  const Info = ({ l, v, bad }) => html`<div><div class="small muted">${l}</div><div style=${bad ? "color:var(--bad);font-weight:600" : "font-weight:500"}>${v || "—"}</div></div>`;

  return html`
    <${Head} title=${html`<span class="num">#${o.number}</span> ${o.title}`} back=${() => go("pedidos")} actions=${html`${canWrite ? html`<button class="btn pri" onClick=${() => go("editar", { id: o.id })}>Editar pedido</button>` : null}${isAdmin ? html`<${Confirm} question="Excluir o pedido com tudo?" onConfirm=${async () => { await api.deleteOrder(o.id); notify("Pedido excluído."); go("pedidos"); }} />` : null}`} />
    <div class="row"><${Pill} tone=${ORDER_TONE[o.status]}>${ORDER_STATUS[o.status]}<//><${Pill} tone=${PAY_TONE[tt.payStatus]}>${PAY_LABEL[tt.payStatus]}<//><${Pill} tone=${REC_TONE[r.status]}>${REC_LABEL[r.status]}<//>${late ? html`<${Pill} tone="p-bad">Atrasado<//>` : null}${o.needsReview ? html`<${Pill} tone="p-warn">Precisa de revisão<//>` : null}</div>
    ${o.needsReview ? html`<div class="banner b-warn row between"><span>Este pedido foi marcado para revisão. Confira os dados.</span>${canWrite ? html`<button class="btn sm" onClick=${() => patch({ needsReview: false }, "Marcado como revisado.")}>Marcar como revisado</button>` : null}</div>` : null}
    ${tt.missingRate ? html`<div class="banner b-warn">Há valores em outra moeda sem cotação. Edite o pedido e informe a cotação.</div>` : null}

    <${Card} title="Resumo"><div class="grid g2">
      <${Info} l="Fornecedor" v=${byId.suppliers[o.supplierId]?.name} /><${Info} l="Data do pedido" v=${fdate(o.orderDate)} /><${Info} l="Previsão" v=${fdate(o.expectedDate)} bad=${late} />
      <${Info} l="Modalidade" v=${byId.modes[o.modeId]?.name} /><${Info} l="Transportadora" v=${byId.carriers[o.carrierId]?.name} /><${Info} l="Moeda" v=${cur === "USD" ? "Dólar ($)" : "Real (R$)"} />
      <${Info} l="Cotação do pedido" v=${tt.orate ? money(tt.orate) + (tt.manualBRL ? " (efetiva, total em reais digitado)" : "") : "—"} /><${Info} l="Total de peças" v=${num(tt.pieces, 0)} />
    </div>
    ${canWrite ? html`<div class="row"><${Field} label="Status do pedido"><select value=${o.status} onChange=${(e) => patch({ status: e.target.value }, "Status atualizado.")}>${Object.entries(ORDER_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//></div>` : null}
    ${o.notes ? html`<div class="banner" style="background:var(--surface-2);white-space:pre-wrap">${o.notes}</div>` : null}<//>

    <${Card} title="Financeiro">
      <div class="stats">
        <${Stat} label="Total ao fornecedor" value=${money(tt.supplierTotalBRL)} sub=${cur === "USD" ? money(tt.supplierTotal, "USD") : null} />
        <${Stat} label="Já pago" value=${money(cur === "USD" ? tt.paidBRL : tt.paid)} sub=${cur === "USD" ? money(tt.paid, "USD") + " (cotação de cada pagamento)" : null} tone="good" />
        <${Stat} label="Falta pagar" value=${money(tt.pending > 0 ? tt.pendingBRL : 0)} sub=${tt.pending < 0 ? "Pago a mais: " + money(-tt.pending, cur) : cur === "USD" ? money(Math.max(tt.pending, 0), "USD") : null} tone=${tt.pending > 0.01 ? "bad" : "good"} />
        <${Stat} label="Imposto e despesas à parte" value=${money(tt.extrasBRL)} sub=${tt.extrasPendingBRL > 0 ? "Despesas pendentes: " + money(tt.extrasPendingBRL) : tt.taxAwaiting ? "Imposto por fora ainda não lançado" : "Nada pendente"} tone=${tt.extrasPendingBRL > 0 || tt.taxAwaiting ? "warn" : null} />
        <${Stat} label="Imposto" value=${o.taxMode === "sem" && tt.taxTotalBRL === 0 ? "Sem imposto" : money(tt.taxTotalBRL)} sub=${tt.taxForecastBRL > 0 ? "Previsto " + money(tt.taxForecastBRL) + (tt.taxDone ? " · concluído" : "") : TAX_LABEL[o.taxMode]} tone=${tt.taxForecastPendingBRL > 0 ? "warn" : null} />
        <${Stat} label="Custo total estimado" value=${money(tt.landedBRL)} sub=${tt.taxForecastPendingBRL > 0 ? "Inclui imposto previsto a pagar" : "Pagamentos + saldo + à parte"} />
        <${Stat} label="Custo real por peça" value=${tt.costPerPiece !== null ? money(tt.costPerPiece) : "—"} sub="Com frete, imposto e despesas" />
      </div>
      <table class="tab"><tbody>
        <tr><td>Produtos</td><td class="r">${M(tt.itemsTotal, cur, tt.orate, true)}</td></tr><tr><td>Frete</td><td class="r">${M(tt.freight, cur, tt.orate, true)}</td></tr>
        <tr><td>Desconto</td><td class="r">− ${M(tt.discount, cur, tt.orate, true)}</td></tr>${tt.supplierExpenses > 0 ? html`<tr><td>Despesas cobradas pelo fornecedor</td><td class="r">${M(tt.supplierExpenses, cur, tt.orate, true)}</td></tr>` : null}
        <tr><td><strong>Total ao fornecedor</strong></td><td class="r"><strong>${M(tt.supplierTotal, cur, tt.orate, true)}</strong></td></tr></tbody></table>
      ${(o.expenses || []).length ? html`<div><div class="small muted" style="font-weight:600;margin-bottom:4px">OUTRAS DESPESAS</div><div class="list">${o.expenses.map((e) => html`<div class="li" key=${e.id}>
        <span>${e.description} <span class="small muted">${e.chargedBySupplier ? "(cobrada pelo fornecedor)" : e.paid ? "(paga)" : "(pendente)"}</span></span>
        <span class="row"><strong class="tab">${M(e.amount, e.currency, tt.orate)}</strong>${!e.chargedBySupplier && canWrite ? html`<button class="btn sm" onClick=${() => patch({ expenses: o.expenses.map((x) => (x.id === e.id ? { ...x, paid: !x.paid } : x)) })}>${e.paid ? "Desmarcar pago" : "Marcar pago"}</button>` : null}</span></div>`)}</div></div>` : null}
    <//>

    <${Payments} ctx=${ctx} o=${o} tt=${tt} patch=${patch} />
    <${Taxes} ctx=${ctx} o=${o} tt=${tt} patch=${patch} />

    <${Card} title=${"Itens (" + (o.items || []).length + ")"}>
      <div class="tablewrap"><table><thead><tr><th>Produto</th><th class="r">Caixas</th><th class="r">Grades</th><th class="r">Peças</th><th class="r">Receb.</th><th class="r">Unit.</th><th class="r">Total</th></tr></thead><tbody>
      ${(o.items || []).map((i) => html`<tr key=${i.id}><td><strong>${byId.products[i.productId]?.name || "—"}</strong><div class="small muted">${[i.variant, i.ppb ? num(i.ppb) + "/caixa" : null, i.grids && i.ppg ? num(i.ppg) + "/grade" : null].filter(Boolean).join(" · ")}</div>
        ${i.sizes ? html`<div class="row" style="margin-top:4px">${Object.entries(i.sizes).map(([s, q]) => html`<${Pill} key=${s}>${s}: ${q}<//>`)}</div>` : null}</td>
        <td class="r">${i.boxes ? num(i.boxes) : "—"}</td><td class="r">${i.grids ? num(i.grids) : "—"}</td><td class="r"><strong>${num(i.pieces, 0)}</strong></td>
        <td class="r" style=${i.receivedQty == null ? "color:var(--muted)" : i.receivedQty === i.pieces && !i.defectiveQty ? "color:var(--good)" : "color:var(--warn)"}>${i.receivedQty == null ? "—" : num(i.receivedQty, 0)}${i.defectiveQty ? html`<div class="small" style="color:var(--bad)">${i.defectiveQty} def.</div>` : null}</td>
        <td class="r">${M(i.unitPrice, cur, tt.orate, true)}</td><td class="r"><strong>${M(n0(i.pieces) * n0(i.unitPrice), cur, tt.orate, true)}</strong></td></tr>`)}
      <tr><td><strong>Total</strong></td><td></td><td></td><td class="r"><strong>${num(tt.pieces, 0)}</strong></td><td class="r">${r.received ? num(r.received, 0) : "—"}</td><td></td><td class="r"><strong>${M(tt.itemsTotal, cur, tt.orate, true)}</strong></td></tr>
      </tbody></table></div>
    <//>

    <${Card} title="Recebimento" actions=${canWrite ? html`<button class="btn pri" onClick=${() => go("conferencia", { id: o.id })}>Conferir recebimento</button>` : null}>
      <div class="stats">
        <${Stat} label="Situação" value=${REC_LABEL[r.status]} /><${Stat} label="Peças esperadas" value=${num(r.expected, 0)} />
        <${Stat} label="Peças recebidas" value=${num(r.received, 0)} tone=${r.received === 0 ? null : r.received < r.expected ? "warn" : "good"} />
        <${Stat} label="Faltando" value=${num(r.missing, 0)} tone=${r.missing > 0 && r.received > 0 ? "warn" : null} /><${Stat} label="Com defeito" value=${num(r.defective, 0)} tone=${r.defective > 0 ? "bad" : null} />
      </div>
      ${r.pt ? html`<div class="small muted">Pacotes recebidos: ${r.pk} de ${r.pt}</div>` : null}
      ${(o.items || []).filter((i) => i.checkNotes).map((i) => html`<div class="banner b-warn" key=${i.id}><strong>${byId.products[i.productId]?.name}:</strong> ${i.checkNotes}</div>`)}
    <//>

    <${Trackings} ctx=${ctx} o=${o} patch=${patch} />`;
}

function Payments({ ctx, o, tt, patch }) {
  const { D, byId, api, isAdmin, canWrite, today: t, notify } = ctx;
  const [date, setDate] = useState(t);
  const [amount, setAmount] = useState("");
  const [currency, setCurrency] = useState(o.currency);
  const [rate, setRate] = useState(toInput(rateFor(D.rates, t)?.usdBrl ?? o.rate));
  const [method, setMethod] = useState("");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editId, setEditId] = useState(null);
  const formRef = useRef(null);
  const cv = useConv();
  // Pagamento em dólar: mostra o valor em reais. Pagamento em reais num pedido em dólar: mostra quanto equivale em dólar.
  const convTarget = currency === "USD" ? "BRL" : o.currency === "USD" ? "USD" : null;
  function reset() {
    setEditId(null); setDate(t); setAmount(""); setCurrency(o.currency); setRate(toInput(rateFor(D.rates, t)?.usdBrl ?? o.rate)); setMethod(""); setNotes(""); setErr(null); cv.clear();
  }
  function startEdit(p) {
    setEditId(p.id); setDate(p.date || ""); setAmount(toInput(p.amount)); setCurrency(p.currency || o.currency);
    setRate(toInput(p.rate ?? rateFor(D.rates, p.date || t)?.usdBrl ?? o.rate)); setMethod(byId.methods[p.methodId]?.name || ""); setNotes(p.notes || ""); setErr(null);
    const tg = (p.currency || o.currency) === "USD" ? "BRL" : o.currency === "USD" ? "USD" : null;
    if (tg) convLoad(cv, p, tg); else cv.clear();
    setTimeout(() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
  }
  async function add() {
    setErr(null);
    const a = parseDec(amount), r = parseDec(rate);
    if (!date) return setErr("Informe a data.");
    if (!a || a <= 0) return setErr("Informe o valor pago.");
    const conv = convTarget ? convResult(a, currency, convTarget, r, cv) : null;
    if (convTarget && !conv) return setErr("Informe a cotação ou o valor convertido deste pagamento.");
    setBusy(true);
    try {
      const methodId = await resolveName(api, D.methods, "methods", method);
      const pay = { id: editId || uid(), date, amount: a, currency, rate: conv ? conv.rate : r || null, brlAmount: conv ? r2(conv.brlAmount) : null, usdAmount: conv ? r2(conv.usdAmount) : null, methodId, notes: notes.trim() || null };
      if (editId) {
        if (!(o.payments || []).some((x) => x.id === editId)) { reset(); return setErr("Este pagamento foi excluído por outra pessoa."); }
        await api.patchOrder(o.id, { payments: o.payments.map((x) => (x.id === editId ? { ...x, ...pay } : x)) });
        reset(); notify("Pagamento alterado.");
      } else {
        await api.patchOrder(o.id, { payments: [...(o.payments || []), pay] });
        setAmount(""); setNotes(""); cv.clear(); notify("Pagamento lançado.");
      }
    } catch (e) { console.error(e); setErr(editId ? "Não foi possível salvar a alteração. Tente de novo." : "Não foi possível lançar. Tente de novo."); }
    setBusy(false);
  }
  const pays = [...(o.payments || [])].sort((a, b) => (a.date < b.date ? -1 : 1));
  return html`<${Card} title=${"Pagamentos ao fornecedor (" + pays.length + ")"}>
    ${pays.length === 0 ? html`<div class="empty">Nenhum pagamento lançado.</div>` : html`<div class="list">${pays.map((p) => {
      const inOrder = p.currency === o.currency ? p.amount : o.currency === "USD" && p.usdAmount != null ? p.usdAmount : o.currency === "BRL" && p.brlAmount != null ? p.brlAmount : convert(p.amount, p.currency, o.currency, p.rate || tt.orate);
      const inBRL = p.currency === "USD" ? (p.brlAmount ?? convert(p.amount, "USD", "BRL", p.rate || tt.orate)) : p.amount;
      return html`<div class="li" key=${p.id} style=${editId === p.id ? "background:var(--accent-soft);border-radius:6px" : ""}><div><strong class="tab">${fdate(p.date)} · ${p.currency === "USD" ? html`${inBRL === null ? money(p.amount, "USD") : money(inBRL)}<span class="brl">${money(p.amount, "USD")}</span>` : money(p.amount)}</strong>${p.currency === "BRL" && o.currency === "USD" && inOrder !== null ? html`<span class="brl">${money(inOrder, "USD")}</span>` : null}
        <div class="small muted">${[byId.methods[p.methodId]?.name, p.rate ? "cotação " + money(p.rate) : null, p.notes].filter(Boolean).join(" · ")}</div></div>
        <span class="row">${canWrite ? html`<button class="btn sm" onClick=${() => startEdit(p)}>Editar</button>` : null}${isAdmin ? html`<${Confirm} small onConfirm=${() => { if (editId === p.id) reset(); patch({ payments: o.payments.filter((x) => x.id !== p.id) }, "Pagamento excluído."); }} />` : null}</span></div>`;
    })}</div>`}
    ${canWrite ? html`<div ref=${formRef} style=${"background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:10px" + (editId ? ";outline:2px solid var(--accent)" : "")}>
      <strong>${editId ? "Editar pagamento" : "Lançar pagamento"}</strong>
      <datalist id="dl-met">${D.methods.map((m) => html`<option key=${m.id} value=${m.name} />`)}</datalist>
      <div class="grid g2">
        <${Field} label="Data"><input type="date" value=${date} onChange=${(e) => { setDate(e.target.value); const rr = rateFor(D.rates, e.target.value); if (rr) setRate(toInput(rr.usdBrl)); }} /><//>
        <${Field} label="Valor pago"><span class="money" data-sym=${SYM(currency)}><input id="pay-amount" inputmode="decimal" value=${amount} placeholder=${tt.pending > 0 ? toInput(tt.pending) : ""} onInput=${(e) => setAmount(e.target.value)} /></span><//>
        <${Field} label="Moeda"><select id="pay-cur" value=${currency} onChange=${(e) => { setCurrency(e.target.value); cv.clear(); }}><option value="BRL">R$</option><option value="USD">$</option></select><//>
        <${Field} label="Cotação ($1 =)"><span class="money" data-sym="R$"><input id="pay-rate" inputmode="decimal" value=${rate} onInput=${(e) => setRate(e.target.value)} /></span><//>
        ${convTarget ? convField(cv, amount, currency, convTarget, rate, "pay-conv") : null}
        <${Field} label="Forma de pagamento"><input list="dl-met" value=${method} onInput=${(e) => setMethod(e.target.value)} /><//>
        <${Field} label="Observação"><input value=${notes} onInput=${(e) => setNotes(e.target.value)} /><//>
      </div>
      ${err ? html`<div class="err">${err}</div>` : null}
      <div class="row"><button class="btn pri" id="pay-save" disabled=${busy} onClick=${add}>${busy ? "Salvando…" : editId ? "Salvar alteração" : "Lançar pagamento"}</button>${editId ? html`<button class="btn" onClick=${reset}>Cancelar</button>` : null}</div></div>` : null}
  <//>`;
}

function Taxes({ ctx, o, tt, patch }) {
  const { D, isAdmin, canWrite, today: t, notify, api } = ctx;
  const [open, setOpen] = useState(tt.taxAwaiting);
  const [date, setDate] = useState(t);
  const [amount, setAmount] = useState("");
  const [currency, setCurrency] = useState("BRL");
  const [rate, setRate] = useState(toInput(rateFor(D.rates, t)?.usdBrl));
  const [trk, setTrk] = useState("");
  const [notes, setNotes] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [fc, setFc] = useState(o.taxForecast ? toInput(o.taxForecast) : "");
  const [fcEdit, setFcEdit] = useState(false);
  async function saveForecast() {
    const v = fc.trim() === "" ? 0 : parseDec(fc);
    if (v === null || v < 0) return;
    await patch({ taxForecast: v }, "Previsão de imposto salva.");
    setFcEdit(false);
  }
  const diff = tt.taxForecastBRL > 0 && tt.taxPaidBRL > 0 ? (tt.taxPaidBRL - tt.taxForecastBRL) / tt.taxForecastBRL * 100 : null;
  const [editId, setEditId] = useState(null);
  const formRef = useRef(null);
  const cv = useConv();
  function reset() {
    setEditId(null); setDate(t); setAmount(""); setCurrency("BRL"); setRate(toInput(rateFor(D.rates, t)?.usdBrl)); setTrk(""); setNotes(""); setErr(null); cv.clear();
  }
  function startEdit(x) {
    setEditId(x.id); setDate(x.date || ""); setAmount(toInput(x.amount)); setCurrency(x.currency || "BRL");
    setRate(toInput(x.rate ?? rateFor(D.rates, x.date || t)?.usdBrl)); setTrk(x.trackingId || ""); setNotes(x.notes || ""); setErr(null); setOpen(true);
    if ((x.currency || "BRL") === "USD") convLoad(cv, x, "BRL"); else cv.clear();
    setTimeout(() => formRef.current?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
  }
  async function add() {
    setErr(null);
    const a = parseDec(amount), r = parseDec(rate);
    if (!a || a <= 0) return setErr("Informe o valor do imposto pago.");
    const conv = currency === "USD" ? convResult(a, "USD", "BRL", r, cv) : null;
    if (currency === "USD" && !conv) return setErr("Informe a cotação ou o valor em reais.");
    setBusy(true);
    try {
      const tax = { id: editId || uid(), date, amount: a, currency, rate: conv ? conv.rate : null, brlAmount: conv ? r2(conv.brlAmount) : null, trackingId: trk || null, notes: notes.trim() || null };
      if (editId) {
        if (!(o.taxPayments || []).some((x) => x.id === editId)) { reset(); setBusy(false); return setErr("Este lançamento foi excluído por outra pessoa."); }
        await api.patchOrder(o.id, { taxPayments: o.taxPayments.map((x) => (x.id === editId ? { ...x, ...tax } : x)) });
        reset(); notify("Lançamento de imposto alterado.");
      } else {
        await api.patchOrder(o.id, { taxMode: o.taxMode === "sem" ? "por_fora" : o.taxMode, taxPayments: [...(o.taxPayments || []), tax] });
        setAmount(""); setNotes(""); cv.clear(); notify("Imposto lançado.");
      }
    } catch (e) { console.error(e); setErr(editId ? "Não foi possível salvar a alteração. Tente de novo." : "Não foi possível lançar. Tente de novo."); }
    setBusy(false);
  }
  const list = o.taxPayments || [];
  return html`<${Card} title="Imposto">
    <div><strong>${TAX_LABEL[o.taxMode]}</strong> <span class="muted">— ${TAX_HINT[o.taxMode]}</span></div>
    ${o.taxMode === "incluso" && o.taxAmount > 0 ? html`<div>Valor incluso: <strong>${M(o.taxAmount, o.currency, tt.orate)}</strong></div>` : null}
    ${o.taxMode === "por_fora" ? html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:8px">
      <div class="row between"><strong>Previsão × real</strong>${tt.taxDone ? html`<${Pill} tone="p-good">Imposto concluído<//>` : tt.taxForecastPendingBRL > 0 ? html`<${Pill} tone="p-warn">Falta ${money(tt.taxForecastPendingBRL)} (previsto)<//>` : null}</div>
      ${fcEdit ? html`<div class="row" style="align-items:flex-end">
          <${Field} label="Imposto previsto"><span class="money" data-sym="R$"><input id="tx-fc" inputmode="decimal" value=${fc} onInput=${(e) => setFc(e.target.value)} placeholder="0,00" /></span><//>
          <button class="btn pri" onClick=${saveForecast}>Salvar</button><button class="btn" onClick=${() => { setFc(o.taxForecast ? toInput(o.taxForecast) : ""); setFcEdit(false); }}>Cancelar</button></div>`
        : html`<div class="tab">Previsto <strong>${tt.taxForecastBRL > 0 ? money(tt.taxForecastBRL) : "—"}</strong> → Real <strong>${money(tt.taxPaidBRL)}</strong>${diff !== null ? html` <span style=${"color:" + (diff > 0.5 ? "var(--bad)" : diff < -0.5 ? "var(--good)" : "var(--muted)")}>(${diff > 0 ? "+" : ""}${num(diff, 1)}%)</span>` : null}
          ${canWrite ? html` <button class="link" onClick=${() => setFcEdit(true)}>${tt.taxForecastBRL > 0 ? "alterar previsão" : "definir previsão"}</button>` : null}</div>`}
      <div class="small muted">${tt.taxDone ? "Concluído: a previsão não conta mais como a pagar." : "Enquanto não for concluído, o que falta da previsão aparece no painel como imposto a pagar."}</div>
      ${canWrite ? html`<div><button class="btn sm" id="tx-done" onClick=${() => patch({ taxDone: !tt.taxDone }, tt.taxDone ? "Imposto reaberto." : "Imposto marcado como concluído.")}>${tt.taxDone ? "Reabrir imposto" : "✓ Imposto concluído"}</button></div>` : null}
    </div>` : null}
    ${tt.taxAwaiting ? html`<div class="banner b-warn">Imposto por fora ainda não lançado. Quando pagar, lance abaixo.</div>` : null}
    ${o.taxMode !== "incluso" ? html`
      ${list.length ? html`<div class="list">${list.map((x) => html`<div class="li" key=${x.id} style=${editId === x.id ? "background:var(--accent-soft);border-radius:6px" : ""}><div><strong class="tab">${fdate(x.date)} · ${x.currency === "USD" && x.brlAmount != null ? html`${money(x.brlAmount)}<span class="brl">${money(x.amount, "USD")}</span>` : M(x.amount, x.currency, x.rate || tt.orate)}</strong>
        <div class="small muted">${[(o.trackings || []).find((k) => k.id === x.trackingId) ? "Pacote " + o.trackings.find((k) => k.id === x.trackingId).code : "Pedido todo", x.rate ? "cotação " + money(x.rate) : null, x.notes].filter(Boolean).join(" · ")}</div></div>
        <span class="row">${canWrite ? html`<button class="btn sm" onClick=${() => startEdit(x)}>Editar</button>` : null}${isAdmin ? html`<${Confirm} small onConfirm=${() => { if (editId === x.id) reset(); patch({ taxPayments: list.filter((y) => y.id !== x.id) }, "Lançamento excluído."); }} />` : null}</span></div>`)}
        <div class="li"><strong>Total de imposto pago</strong><strong class="tab">${money(tt.taxPaidBRL)}</strong></div></div>` : null}
      ${canWrite ? html`<details ref=${formRef} open=${open} onToggle=${(e) => setOpen(e.target.open)} style=${"background:var(--surface-2);border-radius:8px;padding:12px" + (editId ? ";outline:2px solid var(--accent)" : "")}><summary>${editId ? "Editar imposto pago" : "Lançar imposto pago"}</summary>
        <div class="grid g2" style="margin-top:10px">
          <${Field} label="Data do pagamento"><input type="date" value=${date} onChange=${(e) => { setDate(e.target.value); const rr = rateFor(D.rates, e.target.value); if (rr) setRate(toInput(rr.usdBrl)); }} /><//>
          <${Field} label="Valor pago"><span class="money" data-sym=${SYM(currency)}><input id="tax-amount" inputmode="decimal" value=${amount} onInput=${(e) => setAmount(e.target.value)} /></span><//>
          <${Field} label="Moeda"><select id="tax-cur" value=${currency} onChange=${(e) => { setCurrency(e.target.value); cv.clear(); }}><option value="BRL">R$</option><option value="USD">$</option></select><//>
          ${currency === "USD" ? html`<${Field} label="Cotação ($1 =)"><span class="money" data-sym="R$"><input id="tax-rate" inputmode="decimal" value=${rate} onInput=${(e) => setRate(e.target.value)} /></span><//>
          ${convField(cv, amount, "USD", "BRL", rate, "tax-conv")}` : null}
          <${Field} label="Referente a"><select value=${trk} onChange=${(e) => setTrk(e.target.value)}><option value="">Pedido todo</option>${(o.trackings || []).map((k) => html`<option key=${k.id} value=${k.id}>Pacote ${k.code}${k.label ? " (" + k.label + ")" : ""}</option>`)}</select><//>
          <${Field} label="Observação"><input value=${notes} onInput=${(e) => setNotes(e.target.value)} /><//>
        </div>
        ${err ? html`<div class="err">${err}</div>` : null}
        <div class="row" style="margin-top:10px"><button class="btn pri" id="tax-save" disabled=${busy} onClick=${add}>${busy ? "Salvando…" : editId ? "Salvar alteração" : "Lançar imposto"}</button>${editId ? html`<button class="btn" onClick=${reset}>Cancelar</button>` : null}</div></details>` : null}` : null}
  <//>`;
}

function Trackings({ ctx, o, patch }) {
  const { D, byId, api, canWrite, notify, today: t } = ctx;
  const list = o.trackings || [];
  const [adding, setAdding] = useState(list.length === 0);
  const [codes, setCodes] = useState("");
  const [label, setLabel] = useState("");
  const [carrier, setCarrier] = useState(byId.carriers[o.carrierId]?.name || "");
  const [status, setStatus] = useState("postado");
  const [sel, setSel] = useState(new Set());
  const [bulk, setBulk] = useState("em_transito");
  const [editing, setEditing] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const counts = {};
  for (const k of list) counts[k.status] = (counts[k.status] || 0) + 1;

  async function add() {
    setErr(null);
    const all = [...new Set(codes.split(/[\s,;]+/).map((c) => c.trim().toUpperCase()).filter(Boolean))];
    if (!all.length) return setErr("Informe pelo menos um código de rastreio.");
    const have = new Set(list.map((k) => k.code));
    const fresh = all.filter((c) => !have.has(c));
    if (!fresh.length) return setErr("Esses códigos já estão cadastrados neste pedido.");
    setBusy(true);
    try {
      const carrierId = await resolveName(api, D.carriers, "carriers", carrier);
      await patch({ trackings: [...list, ...fresh.map((code) => ({ id: uid(), code, label: norm(label) || null, carrierId, status, received: false, receivedDate: null, notes: null }))] }, fresh.length + " rastreio(s) adicionado(s).");
      setCodes("");
    } finally { setBusy(false); }
  }
  async function applyBulk() {
    await patch({ trackings: list.map((k) => (sel.has(k.id) ? { ...k, status: bulk } : k)) }, "Status aplicado.");
    setSel(new Set());
  }
  return html`<${Card} title=${"Rastreios (" + list.length + ")"}>
    <datalist id="dl-car2">${D.carriers.map((c) => html`<option key=${c.id} value=${c.name} />`)}</datalist>
    ${list.length ? html`<div class="row">${Object.entries(counts).map(([s, n]) => html`<${Pill} key=${s} tone=${TRK_TONE[s]}>${TRK_STATUS[s]}: ${n}<//>`)}<${Pill}>Recebidos: ${list.filter((k) => k.received).length}/${list.length}<//></div>` : null}
    ${canWrite ? (adding ? html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;display:grid;gap:10px">
      <${Field} label="Códigos de rastreio" hint="Cole um ou vários códigos (um por linha ou separados por espaço/vírgula)."><textarea rows="3" value=${codes} onInput=${(e) => setCodes(e.target.value)} placeholder=${"LZ469784745CN\nLZ468458427CN"}></textarea><//>
      <div class="grid g2">
        <${Field} label="Conteúdo (opcional)"><input value=${label} onInput=${(e) => setLabel(e.target.value)} /><//>
        <${Field} label="Transportadora"><input list="dl-car2" value=${carrier} onInput=${(e) => setCarrier(e.target.value)} /><//>
        <${Field} label="Status inicial"><select value=${status} onChange=${(e) => setStatus(e.target.value)}>${Object.entries(TRK_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
      </div>
      ${err ? html`<div class="err">${err}</div>` : null}
      <div class="row"><button class="btn pri" disabled=${busy} onClick=${add}>${busy ? "Adicionando…" : "Adicionar rastreios"}</button>${list.length ? html`<button class="btn" onClick=${() => setAdding(false)}>Fechar</button>` : null}</div></div>`
      : html`<div><button class="btn" onClick=${() => setAdding(true)}>+ Adicionar rastreios</button></div>`) : null}
    ${list.length && canWrite ? html`<div class="row" style="border:1px solid var(--line);border-radius:8px;padding:8px">
      <label class="chk"><input type="checkbox" checked=${sel.size === list.length} onChange=${(e) => setSel(e.target.checked ? new Set(list.map((k) => k.id)) : new Set())} />Todos</label>
      <span class="small muted">${sel.size} selecionado(s) →</span>
      <select style="width:auto" value=${bulk} onChange=${(e) => setBulk(e.target.value)}>${Object.entries(TRK_STATUS).map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`)}</select>
      <button class="btn sm" disabled=${!sel.size} onClick=${applyBulk}>Aplicar status</button></div>` : null}
    ${list.length ? html`<div class="list">${list.map((k) => html`<div key=${k.id} style="padding:8px 0">
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
        ${canWrite ? html`<input type="checkbox" checked=${sel.has(k.id)} onChange=${() => setSel((s) => { const n = new Set(s); n.has(k.id) ? n.delete(k.id) : n.add(k.id); return n; })} />` : null}
        <div style="flex:1;min-width:0"><div class="row"><a class="mono" href=${trackingLink(k.code, byId.carriers[k.carrierId])} target="_blank" rel="noreferrer">${k.code}</a><${Pill} tone=${TRK_TONE[k.status]}>${TRK_STATUS[k.status]}<//>${k.received ? html`<${Pill} tone="p-good">Recebido ${fdate(k.receivedDate)}<//>` : null}</div>
          <div class="small muted">${[k.label, byId.carriers[k.carrierId]?.name, k.notes].filter(Boolean).join(" · ")}</div></div>
        ${canWrite ? html`<button class="btn sm" onClick=${() => setEditing(editing === k.id ? null : k.id)}>${editing === k.id ? "Fechar" : "Editar"}</button>` : null}</div>
      ${editing === k.id ? html`<${TrackingEdit} ctx=${ctx} o=${o} k=${k} patch=${patch} done=${() => setEditing(null)} />` : null}</div>`)}</div>` : null}
  <//>`;
}

function TrackingEdit({ ctx, o, k, patch, done }) {
  const { D, byId, api, today: t } = ctx;
  const [v, setV] = useState({ code: k.code, label: k.label || "", carrier: byId.carriers[k.carrierId]?.name || "", status: k.status, received: !!k.received, receivedDate: k.receivedDate || t, notes: k.notes || "" });
  const [busy, setBusy] = useState(false);
  const set = (a, b) => setV((s) => ({ ...s, [a]: b }));
  async function save() {
    setBusy(true);
    try {
      const carrierId = await resolveName(api, D.carriers, "carriers", v.carrier);
      await patch({ trackings: o.trackings.map((x) => (x.id === k.id ? { ...x, code: v.code.trim().toUpperCase() || x.code, label: norm(v.label) || null, carrierId, status: v.status, received: v.received, receivedDate: v.received ? v.receivedDate : null, notes: v.notes.trim() || null } : x)) }, "Rastreio salvo.");
      done();
    } finally { setBusy(false); }
  }
  return html`<div style="background:var(--surface-2);border-radius:8px;padding:12px;margin-top:8px;display:grid;gap:10px"><div class="grid g2">
    <${Field} label="Código"><input value=${v.code} onInput=${(e) => set("code", e.target.value)} /><//>
    <${Field} label="Conteúdo"><input value=${v.label} onInput=${(e) => set("label", e.target.value)} /><//>
    <${Field} label="Transportadora"><input list="dl-car2" value=${v.carrier} onInput=${(e) => set("carrier", e.target.value)} /><//>
    <${Field} label="Status"><select value=${v.status} onChange=${(e) => set("status", e.target.value)}>${Object.entries(TRK_STATUS).map(([a, l]) => html`<option key=${a} value=${a}>${l}</option>`)}</select><//>
    <label class="chk"><input type="checkbox" checked=${v.received} onChange=${(e) => set("received", e.target.checked)} />Pacote recebido</label>
    ${v.received ? html`<${Field} label="Recebido em"><input type="date" value=${v.receivedDate} onChange=${(e) => set("receivedDate", e.target.value)} /><//>` : null}
    <${Field} label="Observação"><input value=${v.notes} onInput=${(e) => set("notes", e.target.value)} /><//>
  </div><div class="row between"><button class="btn pri" disabled=${busy} onClick=${save}>${busy ? "Salvando…" : "Salvar"}</button>
    <${Confirm} small label="Excluir rastreio" onConfirm=${async () => { await patch({ trackings: o.trackings.filter((x) => x.id !== k.id), taxPayments: (o.taxPayments || []).map((x) => (x.trackingId === k.id ? { ...x, trackingId: null } : x)) }, "Rastreio excluído."); done(); }} /></div></div>`;
}

// ---------------- Conferência ----------------
function Conference({ ctx, id }) {
  const { D, byId, api, go, notify, today: t } = ctx;
  const o = D.orders.find((x) => x.id === id);
  const [items, setItems] = useState(() => (o?.items || []).map((i) => ({ id: i.id, name: byId.products[i.productId]?.name || "—", variant: i.variant, expected: n0(i.pieces), sizes: i.sizes, rq: i.receivedQty == null ? "" : String(i.receivedQty), dq: i.defectiveQty == null ? "" : String(i.defectiveQty), notes: i.checkNotes || "", rs: i.receivedSizes ? Object.fromEntries(Object.entries(i.receivedSizes).map(([s, q]) => [s, String(q)])) : null })));
  const [trk, setTrk] = useState(() => (o?.trackings || []).map((k) => ({ id: k.id, code: k.code, label: k.label, received: !!k.received, date: k.receivedDate || "" })));
  const [upd, setUpd] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  if (!o) return html`<${Head} title="Pedido não encontrado" back=${() => go("pedidos")} />`;
  const up = (iid, p) => setItems((l) => l.map((i) => (i.id === iid ? { ...i, ...p } : i)));
  const fullSizes = (i) => (i.sizes ? Object.fromEntries(Object.entries(i.sizes).map(([s, q]) => [s, String(q)])) : null);
  const exp = items.reduce((s, i) => s + i.expected, 0), rec = items.reduce((s, i) => s + (parseDec(i.rq) || 0), 0), def = items.reduce((s, i) => s + (parseDec(i.dq) || 0), 0);
  const int = (v) => { const n = parseDec(v); return n === null ? null : Math.max(0, Math.round(n)); };
  async function save() {
    setBusy(true); setErr(null);
    try {
      const newItems = o.items.map((i) => {
        const c = items.find((x) => x.id === i.id);
        if (!c) return i;
        let rs = null;
        if (c.rs) { rs = {}; for (const [s, q] of Object.entries(c.rs)) { const n = int(q); if (n !== null) rs[s] = n; } if (!Object.keys(rs).length) rs = null; }
        return { ...i, receivedQty: int(c.rq), defectiveQty: int(c.dq), checkNotes: c.notes.trim() || null, receivedSizes: rs };
      });
      const newTrk = (o.trackings || []).map((k) => { const c = trk.find((x) => x.id === k.id); return c ? { ...k, received: c.received, receivedDate: c.received ? c.date || t : null, status: c.received ? "entregue" : k.status } : k; });
      const p = { items: newItems, trackings: newTrk };
      if (upd && !["finalizado", "cancelado"].includes(o.status) && rec > 0) p.status = rec >= exp ? "recebido" : "recebido_parcial";
      await api.patchOrder(o.id, p);
      notify("Conferência salva.");
      go("pedido", { id: o.id });
    } catch (e) { console.error(e); setErr("Não foi possível salvar. Tente de novo."); }
    setBusy(false);
  }
  return html`<${Head} title=${"Conferência #" + o.number} back=${() => go("pedido", { id: o.id })} />
    <p class="muted" style="margin:0">${o.title}. Informe quanto chegou de cada item e marque os pacotes recebidos. Pode conferir aos poucos.</p>
    <div><button class="btn" onClick=${() => { setItems((l) => l.map((i) => ({ ...i, rq: String(i.expected), rs: fullSizes(i) }))); setTrk((l) => l.map((k) => ({ ...k, received: true, date: k.date || t }))); }}>✓ Marcar tudo como recebido</button></div>
    ${trk.length ? html`<${Card} title=${"Pacotes (" + trk.filter((k) => k.received).length + "/" + trk.length + " recebidos)"}><div class="list">${trk.map((k) => html`<div class="li" key=${k.id}>
      <label class="chk"><input type="checkbox" checked=${k.received} onChange=${(e) => setTrk((l) => l.map((x) => (x.id === k.id ? { ...x, received: e.target.checked, date: x.date || t } : x)))} /><span class="mono">${k.code}</span>${k.label ? html`<span class="muted">(${k.label})</span>` : null}</label>
      ${k.received ? html`<input type="date" style="width:auto" value=${k.date} onChange=${(e) => setTrk((l) => l.map((x) => (x.id === k.id ? { ...x, date: e.target.value } : x)))} />` : null}</div>`)}</div><//>` : null}
    <${Card} title="Itens">${items.map((i) => {
      const r = parseDec(i.rq), d = parseDec(i.dq) || 0, diff = r === null ? null : r - i.expected;
      return html`<div key=${i.id} class=${cx("itembox", r !== null && (diff === 0 && d === 0 ? "ok" : "diff"))}>
        <div class="row between" style="align-items:flex-start"><div><strong>${i.name}</strong><div class="small muted">${i.variant ? i.variant + " · " : ""}Esperado: <strong>${i.expected}</strong> peças</div></div>
          <button class="btn sm" onClick=${() => up(i.id, { rq: String(i.expected), rs: fullSizes(i) })}>Recebi tudo</button></div>
        ${i.sizes ? html`<div class="row">${Object.entries(i.sizes).map(([s, q]) => html`<${Field} key=${s} label=${s + " (esp. " + q + ")"} className="sz"><input inputmode="numeric" style="width:90px" value=${i.rs?.[s] ?? ""} onInput=${(e) => { const rs = { ...(i.rs || {}), [s]: e.target.value }; up(i.id, { rs, rq: String(Object.values(rs).reduce((a, v) => a + (parseDec(v) || 0), 0)) }); }} /><//>`)}</div>` : null}
        <div class="grid g2">
          <${Field} label="Recebido"><input inputmode="numeric" value=${i.rq} onInput=${(e) => up(i.id, { rq: e.target.value })} style="font-weight:600" /><//>
          <${Field} label="Com defeito"><input inputmode="numeric" value=${i.dq} onInput=${(e) => up(i.id, { dq: e.target.value })} /><//>
          <${Field} label="Observação"><input value=${i.notes} onInput=${(e) => up(i.id, { notes: e.target.value })} /><//>
        </div>
        ${diff !== null && (diff !== 0 || d > 0) ? html`<div class="small" style="color:var(--warn);font-weight:600">${diff < 0 ? "Faltam " + -diff + " peças. " : ""}${diff > 0 ? "Vieram " + diff + " peças a mais. " : ""}${d > 0 ? d + " com defeito." : ""}</div>` : null}</div>`;
    })}<//>
    <div class="sticky-foot">
      <div class="row" style="gap:18px"><div><div class="small muted">Esperado</div><strong class="tab">${exp}</strong></div><div><div class="small muted">Recebido</div><strong class="tab" style=${rec < exp ? "color:var(--warn)" : "color:var(--good)"}>${rec}</strong></div><div><div class="small muted">Com defeito</div><strong class="tab" style=${def > 0 ? "color:var(--bad)" : ""}>${def}</strong></div></div>
      <label class="chk"><input type="checkbox" checked=${upd} onChange=${(e) => setUpd(e.target.checked)} />Atualizar status do pedido (Recebido / Recebido parcialmente)</label>
      ${err ? html`<div class="err">${err}</div>` : null}
      <div class="row"><button class="btn pri" disabled=${busy} onClick=${save}>${busy ? "Salvando…" : "Salvar conferência"}</button><button class="btn" onClick=${() => go("pedido", { id: o.id })}>Cancelar</button></div>
    </div>`;
}

// ---------------- Cotação ----------------
function Rates({ ctx }) {
  const { D, api, isAdmin, canWrite, notify, today: t } = ctx;
  const todayRow = D.rates.find((r) => r.id === t);
  const [day, setDay] = useState(t);
  const [val, setVal] = useState(toInput(todayRow?.usdBrl));
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const rows = [...D.rates].sort((a, b) => (a.id < b.id ? 1 : -1)).slice(0, 90);
  async function save() {
    setErr(null);
    const v = parseDec(val);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return setErr("Data inválida.");
    if (!v || v <= 0) return setErr("Informe a cotação (ex.: 5,42).");
    setBusy(true);
    try { await api.setRate(day, v); notify("Cotação salva."); } catch (e) { console.error(e); setErr("Não foi possível salvar."); }
    setBusy(false);
  }
  return html`<${Head} title="Cotação do dólar" />
    <p class="muted" style="margin:0">Defina o valor do dólar do dia. Ele é sugerido nos pedidos e pagamentos daquela data (você pode ajustar em cada um). Se um dia não tiver cotação, vale a última cadastrada antes dele.</p>
    <${Card} title=${todayRow ? "Hoje: $1 = " + money(todayRow.usdBrl) : "Cotação de hoje ainda não definida"}>
      ${canWrite ? html`<div class="row" style="align-items:flex-end">
        <${Field} label="Dia"><input type="date" value=${day} onChange=${(e) => setDay(e.target.value)} /><//>
        <${Field} label="$1 ="><span class="money" data-sym="R$"><input inputmode="decimal" id="rate-val" value=${val} onInput=${(e) => setVal(e.target.value)} /></span><//>
        <button class="btn pri" disabled=${busy} onClick=${save}>${busy ? "Salvando…" : "Salvar cotação"}</button></div>${err ? html`<div class="err">${err}</div>` : null}` : null}
    <//>
    <${Card} title="Histórico">${rows.length ? html`<div class="list">${rows.map((r) => html`<div class="li" key=${r.id}><span>${fdate(r.id)}</span><span class="row"><strong class="tab">${money(r.usdBrl)}</strong>${isAdmin ? html`<${Confirm} small onConfirm=${() => api.deleteRate(r.id)} />` : null}</span></div>`)}</div>` : html`<div class="empty">Nenhuma cotação cadastrada.</div>`}<//>`;
}

// ---------------- Cadastros ----------------
function Cadastros({ ctx }) {
  const { D, api, isAdmin, canWrite, notify } = ctx;
  const [tab, setTab] = useState("suppliers");
  const cfg = ENT[tab];
  const rows = [...D[tab]].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  const blank = () => Object.fromEntries(cfg.fields.map(([k]) => [k, ""]));
  const [form, setForm] = useState(blank);
  const [edit, setEdit] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => { setForm(blank()); setEdit(null); setErr(null); }, [tab]);
  function usedBy(id) {
    return D.orders.some((o) => o.supplierId === id || o.modeId === id || o.carrierId === id || (o.items || []).some((i) => i.productId === id) || (o.payments || []).some((p) => p.methodId === id) || (o.trackings || []).some((k) => k.carrierId === id));
  }
  async function save(values, id) {
    setErr(null);
    const name = norm(values.name);
    if (!name) return setErr("Informe o nome.");
    if (D[tab].some((x) => key(x.name) === key(name) && x.id !== id)) return setErr("Já existe um(a) " + cfg.one + " com esse nome.");
    const body = {};
    for (const [k, , type] of cfg.fields) { const v = values[k]; body[k] = type === "int" ? (parseDec(v) === null ? null : Math.round(parseDec(v))) : norm(v) || null; }
    body.name = name;
    try {
      const prev = id ? D[tab].find((x) => x.id === id) : null;
      await api.saveEntity(tab, id || uid(), { ...(prev ? { createdAt: prev.createdAt } : { createdAt: new Date().toISOString() }), ...body });
      notify("Salvo.");
      if (id) setEdit(null); else setForm(blank());
    } catch (e) { console.error(e); setErr("Não foi possível salvar."); }
  }
  const fields = (values, onChange) => html`<div class="grid g2">${cfg.fields.map(([k, l, type]) => html`<${Field} key=${k} label=${l}><input inputmode=${type === "int" ? "numeric" : undefined} value=${values[k] ?? ""} onInput=${(e) => onChange({ ...values, [k]: e.target.value })} /><//>`)}</div>`;
  return html`<${Head} title="Cadastros" />
    <div class="tabs">${Object.entries(ENT).map(([k, c]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${c.title}</button>`)}<button class=${tab === "backup" ? "on" : ""} onClick=${() => setTab("backup")}>Backup</button></div>
    ${tab === "backup" ? html`<${Backup} ctx=${ctx} />` : html`
    ${canWrite ? html`<${Card} title=${"Novo(a) " + cfg.one}>${fields(form, setForm)}${err && !edit ? html`<div class="err">${err}</div>` : null}<div><button class="btn pri" onClick=${() => save(form)}>Adicionar</button></div><//>` : null}
    <${Card} title=${rows.length + " cadastrado(s)"}>${rows.length ? html`<div class="list">${rows.map((r) => edit && edit.id === r.id ? html`<div key=${r.id} style="padding:10px 0;display:grid;gap:10px">
        ${fields(edit, setEdit)}${err ? html`<div class="err">${err}</div>` : null}
        <div class="row"><button class="btn pri" onClick=${() => save(edit, r.id)}>Salvar</button><button class="btn" onClick=${() => setEdit(null)}>Cancelar</button></div></div>`
      : html`<div class="li" key=${r.id}><div style="min-width:0"><strong>${r.name}</strong><div class="small muted">${cfg.fields.slice(1).map(([k, l]) => (r[k] ? l + ": " + r[k] : null)).filter(Boolean).join(" · ")}</div></div>
        <div class="row">${canWrite ? html`<button class="btn sm" onClick=${() => { setErr(null); setEdit({ id: r.id, ...Object.fromEntries(cfg.fields.map(([k]) => [k, r[k] == null ? "" : String(r[k])])) }); }}>Editar</button>` : null}
        ${isAdmin ? (usedBy(r.id) ? html`<span class="small muted">Em uso</span>` : html`<${Confirm} small onConfirm=${() => api.deleteEntity(tab, r.id)} />`) : null}</div></div>`)}</div>` : html`<div class="empty">Nenhum cadastro ainda. Também dá para cadastrar na hora, digitando um nome novo no pedido.</div>`}<//>`}`;
}

function Backup({ ctx }) {
  const { D, notify } = ctx;
  return html`<${Card} title="Backup dos dados">
    <p style="margin:0">Baixa um arquivo com todos os pedidos, cadastros e cotações. Guarde no Google Drive de vez em quando.</p>
    <div class="row"><button class="btn pri" onClick=${() => saveFile("encomendas-backup-" + today() + ".json", JSON.stringify({ exportedAt: new Date().toISOString(), ...D }, null, 2), notify)}>⬇ Baixar backup</button></div>
    <p class="small muted" style="margin:0">${D.orders.length} pedidos · ${D.suppliers.length} fornecedores · ${D.products.length} produtos · ${D.rates.length} cotações</p>
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
